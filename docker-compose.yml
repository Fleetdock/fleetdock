# Full db-manager stack: Postgres + Go API + Next.js frontend.
#
# Configuration is read from a git-ignored `.env` file in this directory
# (see .env.example). Then:
#   cp .env.example .env
#   ./scripts/generate-secrets.sh >> .env
#   docker compose up --build
# Open http://localhost:3000 and sign in with the bootstrap admin.
name: db-manager

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbmanager
      POSTGRES_PASSWORD: dbmanager
      POSTGRES_DB: dbmanager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmanager -d dbmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      MDCP_HTTP_ADDR: ":8080"
      MDCP_DATABASE_URL: ${MDCP_DATABASE_URL:-postgres://dbmanager:dbmanager@postgres:5432/dbmanager?sslmode=disable}
      MDCP_ENV: ${MDCP_ENV:-development}
      MDCP_JWT_SECRET: ${MDCP_JWT_SECRET:?set MDCP_JWT_SECRET in .env}
      MDCP_ADMIN_EMAIL: ${MDCP_ADMIN_EMAIL:-admin@example.com}
      MDCP_ADMIN_PASSWORD: ${MDCP_ADMIN_PASSWORD:?set MDCP_ADMIN_PASSWORD in .env}
      MDCP_CORS_ORIGIN: ${MDCP_CORS_ORIGIN:-http://localhost:3000}
      MDCP_ENCRYPTION_KEY: ${MDCP_ENCRYPTION_KEY:?set MDCP_ENCRYPTION_KEY in .env}
      MDCP_PUBLIC_URL: ${MDCP_PUBLIC_URL:-http://localhost:8080}
      MDCP_SMTP_HOST: ${MDCP_SMTP_HOST:-}
      MDCP_SMTP_PORT: ${MDCP_SMTP_PORT:-587}
      MDCP_SMTP_USERNAME: ${MDCP_SMTP_USERNAME:-}
      MDCP_SMTP_PASSWORD: ${MDCP_SMTP_PASSWORD:-}
      MDCP_SMTP_FROM: ${MDCP_SMTP_FROM:-db-manager@localhost}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
