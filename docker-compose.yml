# Full Fleetdock stack: Postgres + Go API + Next.js frontend.
#
# Configuration is read from a git-ignored `.env` file in this directory
# (see .env.example). Then:
#   cp .env.example .env
#   ./scripts/generate-secrets.sh >> .env
#   docker compose up --build
# Open http://localhost:3000 and sign in with the bootstrap admin.
name: fleetdock

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleetdock
      POSTGRES_PASSWORD: fleetdock
      POSTGRES_DB: fleetdock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetdock -d fleetdock"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      FLEETDOCK_HTTP_ADDR: ":8080"
      FLEETDOCK_DATABASE_URL: ${FLEETDOCK_DATABASE_URL:-postgres://fleetdock:fleetdock@postgres:5432/fleetdock?sslmode=disable}
      FLEETDOCK_ENV: ${FLEETDOCK_ENV:-development}
      FLEETDOCK_JWT_SECRET: ${FLEETDOCK_JWT_SECRET:?set FLEETDOCK_JWT_SECRET in .env}
      FLEETDOCK_ADMIN_EMAIL: ${FLEETDOCK_ADMIN_EMAIL:-admin@example.com}
      FLEETDOCK_ADMIN_PASSWORD: ${FLEETDOCK_ADMIN_PASSWORD:?set FLEETDOCK_ADMIN_PASSWORD in .env}
      FLEETDOCK_CORS_ORIGIN: ${FLEETDOCK_CORS_ORIGIN:-http://localhost:3000}
      FLEETDOCK_ENCRYPTION_KEY: ${FLEETDOCK_ENCRYPTION_KEY:?set FLEETDOCK_ENCRYPTION_KEY in .env}
      FLEETDOCK_PUBLIC_URL: ${FLEETDOCK_PUBLIC_URL:-http://localhost:8080}
      FLEETDOCK_TRUST_PROXY_HEADERS: ${FLEETDOCK_TRUST_PROXY_HEADERS:-false}
      FLEETDOCK_WORKER_ENABLED: ${FLEETDOCK_WORKER_ENABLED:-true}
      FLEETDOCK_HEARTBEAT_TIMEOUT: ${FLEETDOCK_HEARTBEAT_TIMEOUT:-2m}
      FLEETDOCK_METRICS_RETENTION: ${FLEETDOCK_METRICS_RETENTION:-168h}
      # The compose stack ships a gateway container, so public access is
      # available by default here. A bare binary has no gateway, which is why
      # config.go defaults this to false instead.
      FLEETDOCK_GATEWAY_ENABLED: ${FLEETDOCK_GATEWAY_ENABLED:-true}
      FLEETDOCK_GATEWAY_PUBLIC_HOST: ${FLEETDOCK_GATEWAY_PUBLIC_HOST:-gateway.localhost}
      FLEETDOCK_GATEWAY_PORT_RANGE_START: ${FLEETDOCK_GATEWAY_PORT_RANGE_START:-15432}
      FLEETDOCK_GATEWAY_PORT_RANGE_END: ${FLEETDOCK_GATEWAY_PORT_RANGE_END:-15481}
      FLEETDOCK_GATEWAY_DIAG_PORT: ${FLEETDOCK_GATEWAY_DIAG_PORT:-15431}
      FLEETDOCK_GATEWAY_SOURCE_IP_MODE: ${FLEETDOCK_GATEWAY_SOURCE_IP_MODE:-direct}
      FLEETDOCK_GATEWAY_CONFIG_PATH: ${FLEETDOCK_GATEWAY_CONFIG_PATH:-/var/lib/fleetdock/gateway/haproxy.cfg}
      FLEETDOCK_GATEWAY_MASTER_SOCKET: ${FLEETDOCK_GATEWAY_MASTER_SOCKET:-/var/lib/fleetdock/gateway/haproxy-master.sock}
      FLEETDOCK_GATEWAY_ADMIN_SOCKET: ${FLEETDOCK_GATEWAY_ADMIN_SOCKET:-/var/lib/fleetdock/gateway/haproxy-admin.sock}
      FLEETDOCK_SMTP_HOST: ${FLEETDOCK_SMTP_HOST:-}
      FLEETDOCK_SMTP_PORT: ${FLEETDOCK_SMTP_PORT:-587}
      FLEETDOCK_SMTP_USERNAME: ${FLEETDOCK_SMTP_USERNAME:-}
      FLEETDOCK_SMTP_PASSWORD: ${FLEETDOCK_SMTP_PASSWORD:-}
      FLEETDOCK_SMTP_FROM: ${FLEETDOCK_SMTP_FROM:-fleetdock@localhost}
    volumes:
      - gateway_data:/var/lib/fleetdock/gateway
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        # service_started only means the container was created; the API would
        # try to reload a gateway that has not bound its socket yet.
        condition: service_healthy

  gateway-init:
    image: alpine:3.20
    volumes:
      - gateway_data:/var/lib/fleetdock/gateway
      - ./deploy/haproxy-bootstrap.cfg:/bootstrap/haproxy.cfg:ro
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/fleetdock/gateway
        if [ ! -f /var/lib/fleetdock/gateway/haproxy.cfg ]; then
          cp /bootstrap/haproxy.cfg /var/lib/fleetdock/gateway/haproxy.cfg
        fi
        chown -R 1000:1000 /var/lib/fleetdock/gateway
        chmod 775 /var/lib/fleetdock/gateway
    restart: "no"

  gateway:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    # Must match the uid the API runs as (backend/Dockerfile): both write to
    # the shared volume, and the API connects to HAProxy's sockets.
    user: "1000:1000"
    depends_on:
      gateway-init:
        condition: service_completed_successfully
    command: ["haproxy", "-W", "-f", "/var/lib/fleetdock/gateway/haproxy.cfg", "-S", "/var/lib/fleetdock/gateway/haproxy-master.sock", "-p", "/var/lib/fleetdock/gateway/haproxy.pid"]
    volumes:
      - gateway_data:/var/lib/fleetdock/gateway
    ports:
      # Diagnostics: reports the source address HAProxy actually observes, so a
      # user can discover what to allowlist. Kept outside the endpoint range.
      - "${FLEETDOCK_GATEWAY_DIAG_PORT:-15431}:${FLEETDOCK_GATEWAY_DIAG_PORT:-15431}"
      # Must cover the range the allocator uses, or endpoints get ports that
      # are never published and fail only for external clients.
      - "${FLEETDOCK_GATEWAY_PORT_RANGE_START:-15432}-${FLEETDOCK_GATEWAY_PORT_RANGE_END:-15481}:${FLEETDOCK_GATEWAY_PORT_RANGE_START:-15432}-${FLEETDOCK_GATEWAY_PORT_RANGE_END:-15481}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8404/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  gateway_data:
