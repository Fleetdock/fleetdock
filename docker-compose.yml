# Full db-manager stack: Go API + Next.js frontend, backed by a hosted Neon
# Postgres (no local database container).
#
# Configuration is read from a git-ignored `.env` file in this directory
# (see .env.example). Then:
#   docker compose up --build
# Open http://localhost:3000 and sign in with the bootstrap admin.
name: db-manager

services:
  backend:
    build: ./backend
    environment:
      MDCP_HTTP_ADDR: ":8080"
      MDCP_DATABASE_URL: ${MDCP_DATABASE_URL:?set MDCP_DATABASE_URL in .env}
      MDCP_JWT_SECRET: ${MDCP_JWT_SECRET:-change-me-in-production}
      MDCP_ADMIN_EMAIL: ${MDCP_ADMIN_EMAIL:-admin@example.com}
      MDCP_ADMIN_PASSWORD: ${MDCP_ADMIN_PASSWORD:-admin12345}
      MDCP_CORS_ORIGIN: ${MDCP_CORS_ORIGIN:-http://localhost:3000}
      MDCP_ENCRYPTION_KEY: ${MDCP_ENCRYPTION_KEY:-change-me-in-production}
      MDCP_PUBLIC_URL: ${MDCP_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend
