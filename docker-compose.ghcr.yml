# Run published release images from GHCR instead of building locally.
#
#   export FLEETDOCK_RELEASE_TAG=v0.1.0   # or latest
#   cp .env.example .env && ./scripts/generate-secrets.sh >> .env
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Images: ghcr.io/tajbrains/fleetdock-{backend,frontend}

services:
  backend:
    image: ghcr.io/tajbrains/fleetdock-backend:${FLEETDOCK_RELEASE_TAG:-latest}
    build: !reset null

  frontend:
    image: ghcr.io/tajbrains/fleetdock-frontend:${FLEETDOCK_RELEASE_TAG:-latest}
    build: !reset null
