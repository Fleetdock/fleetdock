openapi: 3.1.0
info:
  title: Fleetdock API
  version: 0.10.0
  description: |
    Self-hosted database control plane API. User routes require a Bearer JWT or
    API token (`fleetd_` prefix). Agent routes under `/agent/v1` use agent bearer
    tokens (`fleeta_` prefix).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Users
  - name: Tokens
  - name: Overview
  - name: Servers
  - name: AgentTokens
    x-displayName: Agent tokens
  - name: Instances
  - name: Databases
  - name: DBAdmin
    x-displayName: Database admin
  - name: Data
    x-displayName: Data browser
    description: Browse, filter, edit and export rows; saved table views.
  - name: Structure
    description: Tables, columns and indexes; the ER diagram; schema history and comparison.
  - name: Console
    x-displayName: SQL console
    description: Run SQL, query history and saved queries.
  - name: Monitoring
    description: Live sessions, locks, server status and query insights.
  - name: Operations
  - name: Backups
  - name: Destinations
  - name: Schedules
  - name: Moves
  - name: Fleet
    x-displayName: Fleet queries
  - name: Notifications
  - name: Audit
    x-displayName: Audit log
  - name: Agent
  - name: Install
  - name: Docs

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    agentAuth:
      type: http
      scheme: bearer
      description: Agent bearer token (fleeta_ prefix)
    metricsAuth:
      type: http
      scheme: bearer
      description: The value of FLEETDOCK_METRICS_TOKEN.
    cookieAuth:
      type: apiKey
      in: cookie
      name: fleetdock_session
      description: >
        The dashboard's session: an httpOnly, SameSite=Strict cookie set by
        login. Requests other than GET/HEAD/OPTIONS authenticated by it must
        also send the header `X-Fleetdock-CSRF: 1`, or they are refused with
        403. Requests with an Authorization bearer token need no such header.

  responses:
    Error:
      description: >
        The request failed. 401 unauthorized (no or expired session/token),
        403 forbidden (missing permission, or a cookie request without the
        CSRF header), 404 not_found, 409 conflict, 422 invalid (with `field`
        naming the input at fault), 429 rate_limited, 500 internal.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TableName:
      name: table
      in: path
      required: true
      description: Table name; on PostgreSQL schema-qualified ("public.orders").
      schema:
        type: string

  schemas:
    Pagination:
      type: object
      required: [total, limit, offset]
      properties:
        total: {type: integer, description: Matching items across all pages.}
        limit: {type: integer}
        offset: {type: integer}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, not_found, conflict, invalid, rate_limited, internal]
            message: {type: string, description: Human-readable; safe to show.}
            field: {type: string, description: "For invalid: the request field at fault."}
    ColumnSpec:
      type: object
      properties:
        name: {type: string}
        type: {type: string, example: "varchar(100)"}
        nullable: {type: boolean}
        default: {type: string, nullable: true}
        default_is_expression: {type: boolean}
        auto_increment: {type: boolean}
        comment: {type: string}
        keep_default:
          type: boolean
          description: modify_column only — keep the current default (and MySQL AUTO_INCREMENT / ON UPDATE).
    ForeignKey:
      type: object
      properties:
        name: {type: string}
        columns: {type: array, items: {type: string}}
        ref_table: {type: string}
        ref_columns: {type: array, items: {type: string}}
        on_delete: {type: string, enum: ["", CASCADE, SET NULL, RESTRICT, NO ACTION]}
        on_update: {type: string, enum: ["", CASCADE, SET NULL, RESTRICT, NO ACTION]}
        table:
          type: string
          description: The referencing table. Set on incoming keys (referenced-by) and in diagram relations.
    FleetRun:
      type: object
      properties:
        id: {type: string, format: uuid}
        created_by: {type: string, format: uuid}
        sql: {type: string}
        writes: {type: boolean, description: The script has at least one statement that writes.}
        status: {type: string, enum: [running, paused, canceling, succeeded, failed, canceled]}
        concurrency: {type: integer}
        stop_on_error: {type: boolean}
        canary: {type: boolean, description: Run the first database alone and pause until resumed.}
        timeout_seconds: {type: integer}
        row_limit: {type: integer}
        total: {type: integer}
        succeeded: {type: integer}
        failed: {type: integer}
        skipped: {type: integer, description: Not run because an earlier database failed or the run was canceled.}
        running: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    FleetTarget:
      type: object
      properties:
        position: {type: integer}
        database_id: {type: string, format: uuid}
        database_name: {type: string}
        instance_name: {type: string}
        engine: {type: string}
        status: {type: string, enum: [pending, running, succeeded, failed, skipped, canceled, unknown]}
        results:
          type: object
          description: The console results of the script on this database (rows trimmed to fit the run's storage limit).
          properties:
            results: {type: array, items: {type: object}}
            error:
              type: object
              properties:
                statement: {type: integer}
                message: {type: string}
            trimmed: {type: boolean}
        rows_affected: {type: integer, format: int64}
        error: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    SchemaWatch:
      type: object
      properties:
        database_id: {type: string, format: uuid}
        enabled: {type: boolean}
        last_checked_at: {type: string, format: date-time}
        last_error: {type: string}
        updated_at: {type: string, format: date-time}
    SchemaSnapshot:
      type: object
      properties:
        id: {type: string, format: uuid}
        database_id: {type: string, format: uuid}
        hash: {type: string, description: SHA-256 of the canonical structure; equal structures hash equally.}
        summary:
          type: object
          properties:
            counts:
              type: object
              properties:
                tables: {type: integer}
                views: {type: integer}
                routines: {type: integer}
                triggers: {type: integer}
            changes:
              type: object
              description: Differences from the previous snapshot.
              properties:
                added: {type: integer}
                removed: {type: integer}
                changed: {type: integer}
            highlights: {type: array, items: {type: string}}
            truncated: {type: boolean}
            stored: {type: boolean, description: False when the structure was too large to keep (hash only).}
        previous_id: {type: string, format: uuid}
        trigger: {type: string, enum: [scheduled, manual, ddl]}
        taken_by: {type: string, format: uuid}
        taken_at: {type: string, format: date-time}
    SchemaChange:
      type: object
      properties:
        kind: {type: string, enum: [table, column, index, constraint, options, view, routine, trigger, type, extension]}
        op: {type: string, enum: [added, removed, changed]}
        schema: {type: string}
        table: {type: string}
        name: {type: string}
        before: {type: string, description: The definition before (or in the target).}
        after: {type: string, description: The definition after (or in the source).}
    BackupCopy:
      type: object
      properties:
        id: {type: string, format: uuid}
        database_id: {type: string, format: uuid}
        backup_id: {type: string, format: uuid}
        instance_id: {type: string, format: uuid}
        scratch_name: {type: string}
        status: {type: string, enum: [restoring, ready, failed, dropping, dropped]}
        job_id: {type: string, format: uuid}
        error: {type: string}
        ready_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        backup_created_at: {type: string, format: date-time}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DiffCursor:
      type: object
      properties:
        phase: {type: string, enum: [live, backup]}
        after: {type: object, additionalProperties: true}
    RowEditResult:
      type: object
      properties:
        status: {type: string, enum: [inserted, updated, deleted]}
        change_id: {type: string, format: uuid, description: The journal entry; absent when the journal is off.}
        undoable: {type: boolean}
        note: {type: string, description: "Why the change cannot be undone, when it cannot."}
    RowChange:
      type: object
      properties:
        id: {type: string, format: uuid}
        database_id: {type: string, format: uuid}
        table: {type: string}
        op: {type: string, enum: [insert, update, delete]}
        key: {type: object, additionalProperties: true}
        before: {type: object, additionalProperties: true, nullable: true}
        after: {type: object, additionalProperties: true, nullable: true}
        columns: {type: array, items: {type: string}}
        undoable: {type: boolean}
        note: {type: string}
        batch_id: {type: string, format: uuid}
        source: {type: string, enum: [editor, undo, restore]}
        user_id: {type: string, format: uuid}
        user_email: {type: string}
        undo_of: {type: string, format: uuid}
        undone_at: {type: string, format: date-time}
        undone_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    UndoResult:
      type: object
      properties:
        change_id: {type: string, format: uuid}
        ok: {type: boolean}
        conflict: {type: boolean, description: The row changed since; retry with force to overwrite.}
        error: {type: string}
        undo: {$ref: "#/components/schemas/RowEditResult"}
    IndexDef:
      type: object
      properties:
        schema: {type: string}
        table: {type: string}
        name: {type: string}
        columns: {type: array, items: {type: string}}
        unique: {type: boolean}
        primary: {type: boolean}
        partial: {type: boolean}
        expression: {type: boolean}
        method: {type: string}
        size_bytes: {type: integer}
        scans: {type: integer, description: Absent when the server does not track usage.}
    IndexFinding:
      type: object
      properties:
        index: {$ref: "#/components/schemas/IndexDef"}
        reason: {type: string}
        covered_by: {type: string}
        drop_sql: {type: string}
    IndexInsights:
      type: object
      properties:
        indexes: {type: array, items: {$ref: "#/components/schemas/IndexDef"}}
        usage_available: {type: boolean}
        stats_since: {type: string, format: date-time}
        note: {type: string}
        unused: {type: array, items: {$ref: "#/components/schemas/IndexFinding"}}
        redundant: {type: array, items: {$ref: "#/components/schemas/IndexFinding"}}
    SchemaSearchHit:
      type: object
      properties:
        database_id: {type: string, format: uuid}
        database: {type: string}
        instance_id: {type: string, format: uuid}
        instance: {type: string}
        engine: {type: string}
        schema: {type: string, description: PostgreSQL schema; absent on MySQL/MariaDB.}
        table: {type: string}
        kind: {type: string, enum: [table, view]}
        column: {type: string, description: Set when the match is a column.}
        type: {type: string, description: The column's type.}
    ColumnCatalog:
      type: object
      properties:
        truncated:
          type: boolean
          description: The database has more than 5000 tables or 100000 columns; only the first are listed.
        tables:
          type: array
          items:
            type: object
            properties:
              schema: {type: string, description: PostgreSQL schema; empty on MySQL/MariaDB.}
              name: {type: string}
              kind: {type: string, enum: [table, view]}
              columns:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    type: {type: string}
                    nullable: {type: boolean}
                    primary_key: {type: boolean, description: Part of the table's primary key.}
    AuditEvent:
      type: object
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        actor_user_id: {type: string, format: uuid, description: "Absent for the system and for failed logins, and once the user is deleted."}
        actor_email: {type: string, description: The user's email at the time; kept after the user is deleted.}
        actor_kind:
          type: string
          enum: [user, api_token, system, anonymous]
          description: How the actor authenticated. `system` is the CLI; `anonymous` a failed login.
        token_id: {type: string, format: uuid, description: "The API token used, when actor_kind is api_token."}
        ip: {type: string}
        user_agent: {type: string}
        action:
          type: string
          description: >-
            What was done, as `<category>.<verb>`: auth.login, user.create, database.delete, sql.execute,
            data.row_update, backup.restore, api_token.create, and so on.
        outcome:
          type: string
          enum: [success, denied, failure]
          description: "`denied`: refused for lack of permission. `failure`: a failed login."
        resource_type: {type: string, description: "user, role, server, instance, database, backup, backup_destination, backup_schedule, notification_channel, alert_rule, api_token, agent_token, fleet_run, operation"}
        resource_id: {type: string, format: uuid}
        resource_name: {type: string, description: The resource's name when the event was recorded.}
        metadata:
          type: object
          description: >-
            Secret-free details: the table for data and structure changes, the script (first 4 KB) and statement
            counts for sql.execute, and the like.
    TableView:
      type: object
      properties:
        id: {type: string, format: uuid}
        database_id: {type: string, format: uuid}
        table: {type: string, description: 'The table, as the data browser names it ("schema.table" on PostgreSQL).'}
        name: {type: string}
        state:
          type: object
          description: The dashboard's view state (filters, sort, search, hidden and frozen columns, widths, page size). Opaque to the API; at most 64 KB.
        shared: {type: boolean, description: Listed to everyone who can read the database.}
        created_by: {type: string, format: uuid}
        author_email: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TableViewInput:
      type: object
      properties:
        table: {type: string, description: Required on create; cannot change.}
        name: {type: string, minLength: 1, maxLength: 100}
        state: {type: object}
        shared: {type: boolean}
    Diagram:
      type: object
      properties:
        schemas:
          type: array
          description: Every PostgreSQL schema with its tables and views, whatever the filter. Absent on MySQL/MariaDB.
          items:
            type: object
            properties:
              name: {type: string}
              tables: {type: integer}
              views: {type: integer}
        truncated:
          type: boolean
          description: The database has more tables, columns or foreign keys than are listed (5000 tables, 100000 columns, 20000 foreign keys).
        tables:
          type: array
          items:
            type: object
            properties:
              schema: {type: string, description: PostgreSQL schema; empty on MySQL/MariaDB.}
              name: {type: string}
              kind: {type: string, enum: [table, view]}
              row_estimate: {type: integer, format: int64, description: The engine's row estimate from statistics; absent for views.}
              columns:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    type: {type: string}
                    nullable: {type: boolean}
                    primary_key: {type: boolean}
        relations:
          type: array
          description: >-
            Foreign keys between the database's tables. `table` and `ref_table` are "schema.table" on PostgreSQL
            and the table name on MySQL/MariaDB.
          items: {$ref: "#/components/schemas/ForeignKey"}
    TableSpec:
      type: object
      properties:
        name: {type: string}
        columns: {type: array, items: {$ref: "#/components/schemas/ColumnSpec"}}
        primary_key: {type: array, items: {type: string}}
        foreign_keys: {type: array, items: {$ref: "#/components/schemas/ForeignKey"}}
        comment: {type: string}
    AlterOp:
      type: object
      properties:
        op: {type: string, enum: [add_column, drop_column, modify_column, rename_column, add_foreign_key, drop_foreign_key]}
        name: {type: string, description: Existing column or constraint}
        new_name: {type: string}
        column: {$ref: "#/components/schemas/ColumnSpec"}
        foreign_key: {$ref: "#/components/schemas/ForeignKey"}
    RowValues:
      type: object
      description: Column name to value; null is SQL NULL.
      additionalProperties: {type: string, nullable: true}
    BrowseRequest:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            properties:
              column: {type: string}
              op:
                type: string
                enum: [eq, ne, lt, lte, gt, gte, contains, not_contains, starts_with, ends_with, in, not_in, between, is_null, not_null]
              value: {type: string, nullable: true, description: The operand of comparison and text operators.}
              values:
                type: array
                items: {type: string}
                description: The list of in / not_in (1 to 1000 values), or the two bounds of between (inclusive).
        sort:
          type: array
          items:
            type: object
            properties:
              column: {type: string}
              desc: {type: boolean}
        search: {type: string, description: Case-insensitive match on any column}
        limit: {type: integer, maximum: 500, default: 50}
        offset: {type: integer}
    BrowseResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              type: {type: string}
              nullable: {type: boolean}
              has_default: {type: boolean}
        rows:
          type: array
          items:
            type: array
            items: {type: string, nullable: true}
        total: {type: integer, format: int64}
        total_exact: {type: boolean}
        total_capped: {type: boolean}
        key:
          type: array
          items: {type: string}
    Process:
      type: object
      properties:
        id: {type: integer, format: int64}
        user: {type: string}
        host: {type: string}
        database: {type: string, nullable: true}
        state: {type: string}
        seconds: {type: integer, format: int64}
        query: {type: string, nullable: true}
    Setting:
      type: object
      properties:
        name: {type: string}
        value: {type: string}
    InstanceHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unreachable, unknown]
        version: {type: string}
        latency_ms: {type: integer}
        error: {type: string}
        checked_at: {type: string, format: date-time}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: {type: string}
        user: {type: object, properties: {email: {type: string}, id: {type: string}}, required: [id, email]}
    Server:
      type: object
      required: [id, name, hostname, status, labels, tags, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        hostname: {type: string}
        status: {type: string}
        address: {type: [string, 'null']}
        agent_status: {type: string}
        agent_version: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        labels: {type: object, additionalProperties: {type: string}}
        last_heartbeat_at: {type: [string, 'null'], format: date-time}
        os: {type: [string, 'null']}
        tags: {type: array, items: {type: string}}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    Instance:
      type: object
      required: [id, name, engine, kind, has_credentials, tls_mode, provisioned, engine_version, port, status, labels, tags, created_at, updated_at, version, data_access]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        engine: {type: string, enum: [mariadb, mysql, postgres]}
        kind: {type: string, enum: [managed, external]}
        tls_mode: {type: string, enum: [disable, prefer, require, verify-full], description: How the control plane secures connections to the instance.}
        health: {$ref: '#/components/schemas/InstanceHealth'}
        ssh_tunnel: {$ref: '#/components/schemas/SSHTunnel'}
        data_access: {type: string, enum: [admin, login, managed], description: 'Login the table browser, SQL console, exports and SQL imports use: `admin` — the instance''s admin login (only instance administrators may use them); `login` — the dedicated `data_username`; `managed` — read-only and read-write roles Fleetdock creates per database.'}
        data_username: {type: string, nullable: true, description: The dedicated data login (data_access `login` only).}
        container_id: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        engine_version: {type: string}
        has_credentials: {type: boolean}
        host: {type: [string, 'null']}
        labels: {type: object, additionalProperties: {type: string}}
        port: {type: integer}
        provisioned: {type: boolean}
        server_id: {type: [string, 'null']}
        status: {type: string}
        tags: {type: array, items: {type: string}}
        updated_at: {type: string, format: date-time}
        username: {type: [string, 'null']}
        version: {type: integer}
    SSHTunnel:
      type: object
      nullable: true
      description: SSH bastion an external instance is reached through (null when it is reached
        directly). The instance host is resolved on the bastion.
      required: [host, port, username, auth_method]
      properties:
        host: {type: string}
        port: {type: integer, default: 22}
        username: {type: string}
        auth_method: {type: string, enum: [password, key]}
        host_key_fingerprint: {type: string, nullable: true, description: 'SHA256 fingerprint of the bastion host key, pinned on the first successful connection (trust on first use); null until then.'}
    SSHTunnelInput:
      type: object
      required: [host, username, auth_method]
      properties:
        host: {type: string}
        port: {type: integer, default: 22}
        username: {type: string}
        auth_method:
          type: string
          enum: [password, key]
        password: {type: string, writeOnly: true, description: "Required for auth_method=password."}
        private_key:
          type: string
          writeOnly: true
          description: OpenSSH or PEM private key. Required for auth_method=key.
        passphrase: {type: string, writeOnly: true, description: "Passphrase of an encrypted private key."}
    InstanceRef:
      type: object
      description: Summary of the instance a database lives on, embedded in list and get responses
        so clients need no second request to resolve the name.
      required: [id, name, engine, kind, provisioned, has_credentials]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        engine: {type: string}
        kind: {type: string, enum: [managed, external]}
        server_id: {type: string, format: uuid, nullable: true}
        provisioned: {type: boolean}
        has_credentials: {type: boolean}
    Database:
      type: object
      required: [id, instance_id, name, charset, collation, status, system, size_bytes, active_connections, labels, tags, created_at, updated_at, version]
      properties:
        id: {type: string, format: uuid}
        instance_id: {type: string, format: uuid}
        instance: {$ref: '#/components/schemas/InstanceRef'}
        name: {type: string}
        status: {type: string}
        active_connections: {type: integer}
        charset: {type: string}
        collation: {type: string}
        created_at: {type: string, format: date-time}
        labels: {type: object, additionalProperties: {type: string}}
        locked_at: {type: [string, 'null'], format: date-time}
        locked_by: {type: [string, 'null']}
        missing_since: {type: [string, 'null'], format: date-time}
        size_bytes: {type: integer}
        system: {type: boolean}
        tags: {type: array, items: {type: string}}
        updated_at: {type: string, format: date-time}
        version: {type: integer}
    Backup:
      type: object
      required: [id, database_id, type, engine, status, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string}
        database_name: {type: string, description: Name of the backed-up database.}
        instance_name: {type: string, description: Name of the database server it lives on.}
        checksum: {type: [string, 'null']}
        completed_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        database_id: {type: string}
        destination_id: {type: [string, 'null']}
        engine: {type: string}
        error: {type: [string, 'null']}
        operation_id: {type: [string, 'null']}
        size_bytes: {type: [integer, 'null']}
        started_at: {type: [string, 'null'], format: date-time}
        storage_url: {type: [string, 'null']}
        type: {type: string}
        verified_at: {type: [string, 'null'], format: date-time}
        verify_error: {type: [string, 'null']}
        verify_status: {type: [string, 'null']}
    Operation:
      type: object
      required: [id, type, resource_type, status, progress, created_at]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        status: {type: string}
        resource_type: {type: string}
        resource_id: {type: string, format: uuid}
        resource_name: {type: string, description: 'Display name of the resource (for a backup, its database).'}
        completed_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        error: {type: [string, 'null']}
        params: {}
        progress: {type: integer}
        result: {}
        server_id: {type: [string, 'null']}
        started_at: {type: [string, 'null'], format: date-time}

    APIToken:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        created_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        id: {type: string}
        last_used_at: {type: [string, 'null'], format: date-time}
        name: {type: string}
        prefix: {type: string}
        revoked_at: {type: [string, 'null'], format: date-time}
        scopes: {type: array, items: {type: string}}

    AgentToken:
      type: object
      required: [id, name, expires_at, created_at]
      properties:
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        id: {type: string}
        name: {type: string}
        server_id: {type: [string, 'null']}
        used_at: {type: [string, 'null'], format: date-time}

    AlertRule:
      type: object
      required: [id, name, target_type, metric, comparator, threshold, for_seconds, severity, channel_ids, enabled, created_at]
      properties:
        channel_ids: {type: array, items: {type: string}}
        comparator: {type: string}
        created_at: {type: string, format: date-time}
        enabled: {type: boolean}
        for_seconds: {type: integer}
        id: {type: string}
        metric: {type: string}
        name: {type: string}
        severity: {type: string}
        target_id: {type: [string, 'null']}
        target_type: {type: string}
        threshold: {type: number}

    Channel:
      type: object
      required: [id, name, type, config, enabled, created_at]
      properties:
        config: {type: object, additionalProperties: {type: string}}
        created_at: {type: string, format: date-time}
        enabled: {type: boolean}
        id: {type: string}
        name: {type: string}
        type: {type: string}

    Destination:
      type: object
      required: [id, name, provider, bucket, access_key_id, created_at]
      properties:
        access_key_id: {type: string}
        bucket: {type: string}
        created_at: {type: string, format: date-time}
        endpoint: {type: string}
        id: {type: string}
        name: {type: string}
        prefix: {type: string}
        provider: {type: string}
        region: {type: string}

    Me:
      type: object
      required: [id, email, name, permissions, grants]
      properties:
        email: {type: string}
        name: {type: string}
        grants: {type: array, items: {type: object, properties: {permission: {type: string}, scope_id: {type: string}, scope_type: {type: string}}, required: [permission, scope_type]}}
        id: {type: string}
        permissions: {type: array, items: {type: string}}

    NewAPIToken:
      type: object
      required: [id, name, prefix, scopes, created_at, token]
      properties:
        created_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        id: {type: string}
        last_used_at: {type: [string, 'null'], format: date-time}
        name: {type: string}
        prefix: {type: string}
        revoked_at: {type: [string, 'null'], format: date-time}
        scopes: {type: array, items: {type: string}}
        token: {type: string}

    NewAgentToken:
      type: object
      required: [id, name, expires_at, created_at, token, install_command]
      properties:
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        id: {type: string}
        install_command: {type: string}
        name: {type: string}
        server_id: {type: [string, 'null']}
        token: {type: string}
        used_at: {type: [string, 'null'], format: date-time}

    Role:
      type: object
      required: [id, name, description, is_system, permissions]
      properties:
        description: {type: string}
        id: {type: string}
        is_system: {type: boolean}
        name: {type: string}
        permissions: {type: array, items: {type: string}}

    RoleGrant:
      type: object
      required: [id, role, scope_type]
      properties:
        id: {type: string}
        role: {type: string}
        scope_id: {type: [string, 'null']}
        scope_type: {type: string}

    Schedule:
      type: object
      required: [id, database_id, destination_id, cron, engine, retention_days, enabled, created_at]
      properties:
        created_at: {type: string, format: date-time}
        cron: {type: string}
        database_id: {type: string}
        database_name: {type: string}
        destination_id: {type: string}
        enabled: {type: boolean}
        engine: {type: string}
        id: {type: string}
        instance_name: {type: string}
        last_run_at: {type: [string, 'null'], format: date-time}
        next_run_at: {type: [string, 'null'], format: date-time}
        retention_days: {type: integer}

    User:
      type: object
      required: [id, email, name, status, roles, created_at, updated_at]
      properties:
        created_at: {type: string, format: date-time}
        email: {type: string}
        id: {type: string}
        name: {type: string}
        roles: {type: array, items: {type: string}}
        status: {type: string}
        updated_at: {type: string, format: date-time}

    OwnedAPIToken:
      type: object
      required: [id, name, prefix, scopes, created_at, user_id, user_email]
      properties:
        created_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        id: {type: string}
        last_used_at: {type: [string, 'null'], format: date-time}
        name: {type: string}
        prefix: {type: string}
        revoked_at: {type: [string, 'null'], format: date-time}
        scopes: {type: array, items: {type: string}}
        user_email: {type: string}
        user_id: {type: string}

paths:
  /v1/saved-queries/{id}:
    patch:
      tags: [Console]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Update a saved query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                sql: {type: string}
                database_id: {type: string, format: uuid, nullable: true}
      responses:
        "200":
          description: Updated
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [Console]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Delete a saved query
      responses:
        "204":
          description: Deleted
        default: {$ref: "#/components/responses/Error"}

  /v1/saved-queries:
    get:
      tags: [Console]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Your saved queries
      parameters:
        - name: database_id
          in: query
          schema: {type: string, format: uuid}
          description: Limit to this database's queries plus unscoped ones.
      responses:
        "200":
          description: Saved queries
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Console]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Save a query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                sql: {type: string}
                database_id: {type: string, format: uuid, nullable: true}
      responses:
        "201":
          description: Saved
        default: {$ref: "#/components/responses/Error"}

  /v1/instances/{id}/db-users/password:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Set a database account's password
      description: >
        Refused for the instance's own admin login (edit the instance instead) and
        for Fleetdock-managed console roles. PostgreSQL passwords are sent as
        SCRAM verifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string}
                host: {type: string}
                password: {type: string, writeOnly: true}
      responses:
        "200":
          description: Changed
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/import-sql:
    post:
      tags: [Backups]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: destination_id
          in: query
          required: true
          schema: {type: string, format: uuid}
          description: Backup destination used to stage the file for the executor.
        - name: gzip
          in: query
          schema: {type: boolean}
          description: The body is already gzip-compressed.
      summary: Import a SQL file
      description: >
        Applies a SQL dump (max 2 GB) to the database through the restore path,
        running as the database's read-write role — never as the instance admin.
        The staged file is deleted afterwards. Requires database:write and
        backup:write.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "202":
          description: Import operation started
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/query-history:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Your console history for this database
      description: The caller's most recent runs (up to 200 are kept per database).
      responses:
        "200":
          description: History
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/query/{qid}/cancel:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: qid
          in: path
          required: true
          schema: {type: string, format: uuid}
      summary: Cancel a running console query
      description: >
        Only the user who started the query can cancel it. The statement is
        killed on the database server as well.
      responses:
        "202":
          description: Cancelling
        default: {$ref: "#/components/responses/Error"}

  /v1/backups/{id}/verify:
    post:
      tags: [Backups]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Verify backup (test restore)
      description: >
        Restores the backup into a throwaway database on its instance (checking the
        checksum and that tables come back), records the outcome on the backup
        (`verify_status`, `verified_at`, `verify_error`) and drops the throwaway
        database. Requires backup:write.
      responses:
        "202":
          description: Verification operation started
        default: {$ref: "#/components/responses/Error"}

  /v1/backups/{id}/download:
    get:
      tags: [Backups]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Download link
      description: >
        Returns a presigned link (valid 15 minutes) to the backup's gzipped SQL
        dump, downloaded directly from the bucket. Requires backup:read.
      responses:
        "200":
          description: Link
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                  expires_at: {type: string, format: date-time}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/objects:
    get:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: List views, routines, triggers, sequences and events
      responses:
        "200":
          description: Schema objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: {type: string, enum: [view, materialized_view, function, procedure, trigger, sequence, event]}
                        schema: {type: string}
                        name: {type: string}
                        table: {type: string}
                        definition: {type: string, nullable: true}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/tables/{table}/foreign-keys:
    get:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: List foreign keys
      responses:
        "200":
          description: Foreign keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ForeignKey"}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/tables/{table}/referenced-by:
    get:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: List incoming foreign keys
      description: Foreign keys of tables in this database that reference the table. `table` names the referencing table.
      responses:
        "200":
          description: Incoming foreign keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ForeignKey"}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/columns:
    get:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: List every table's columns
      description: >-
        All tables and views of the database with their columns, in one call, as the data login sees them.
        Used for SQL autocompletion.
      responses:
        "200":
          description: Column catalog
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ColumnCatalog"}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/diagram:
    get:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: schemas
          in: query
          schema: {type: string}
          description: >-
            Comma-separated PostgreSQL schemas (at most 100). Only their tables are returned, with the foreign keys
            that start or end in them; a key may then name a table of another schema. Ignored on MySQL/MariaDB.
      summary: Entity-relationship diagram data
      description: >-
        The database's tables and views with their columns, primary keys and row estimates, and every foreign key
        between them, as the data login sees them. The dashboard draws its Diagram tab from it.
      responses:
        "200":
          description: Diagram
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Diagram"}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/table-views:
    get:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: List saved table views
      description: Your own saved views of the database's tables and the ones others shared. Requires database:read.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: table, in: query, schema: {type: string}, description: Only views of this table.}
      responses:
        "200":
          description: Views
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/TableView"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Save a table view
      parameters: [{$ref: "#/components/parameters/ResourceID"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TableViewInput"}
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TableView"}
        "409": {description: You already have a view with this name on this table}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/table-views/{viewId}:
    patch:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Change a saved table view
      description: Only its author can change it.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: viewId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TableViewInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TableView"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Delete a saved table view
      description: Its author can delete it; a shared view can also be deleted by someone with database:write.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: viewId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/schema/snapshots:
    get:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceID"}]
      summary: Schema history of a database
      description: The database's watch setting and its snapshots, newest first (up to 200). Needs data access.
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: object
                properties:
                  watch: {$ref: "#/components/schemas/SchemaWatch"}
                  interval_seconds: {type: integer, description: How often watched databases are checked; 0 = only by hand.}
                  items: {type: array, items: {$ref: "#/components/schemas/SchemaSnapshot"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceID"}]
      summary: Snapshot the schema now
      description: >-
        Reads the database's structure with the instance's admin login and records it if it differs from the latest
        snapshot (201); otherwise returns the latest snapshot (200).
      responses:
        "200":
          description: Unchanged
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot: {$ref: "#/components/schemas/SchemaSnapshot"}
                  created: {type: boolean}
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot: {$ref: "#/components/schemas/SchemaSnapshot"}
                  created: {type: boolean}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/schema/snapshots/{snapshotId}:
    get:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: snapshotId, in: path, required: true, schema: {type: string, format: uuid}}
      summary: One schema snapshot and what changed since the previous one
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot: {$ref: "#/components/schemas/SchemaSnapshot"}
                  previous: {$ref: "#/components/schemas/SchemaSnapshot"}
                  changes: {type: array, items: {$ref: "#/components/schemas/SchemaChange"}}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/schema/watch:
    put:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceID"}]
      summary: Turn schema history on or off
      description: >-
        A watched database is checked every FLEETDOCK_SCHEMA_SNAPSHOT_INTERVAL and after DDL made through Fleetdock; a
        change records a snapshot and emits a database.schema_changed notification. Turning it on takes the first
        snapshot right away. Needs database:write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        "200":
          description: Watch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SchemaWatch"}
        default: {$ref: "#/components/responses/Error"}

  /v1/fleet-runs:
    post:
      tags: [Fleet]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Run a script on many databases
      description: >-
        Queues the script to run on each database (up to 500), a few at a time, in the background. Every database
        needs the same access as the SQL console (database:read, database:write when the script writes, and
        instance:write for system databases or admin-login instances), checked now and again just before it runs
        there. A script that writes stops at the first failure and runs the first database alone, pausing until
        resumed, unless stop_on_error / canary say otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql, database_ids]
              properties:
                sql: {type: string}
                database_ids: {type: array, items: {type: string, format: uuid}, maxItems: 500}
                concurrency: {type: integer, minimum: 1, maximum: 16, default: 4}
                stop_on_error: {type: boolean, description: Default true when the script writes.}
                canary: {type: boolean, description: Default true when the script writes and there are several databases.}
                timeout_seconds: {type: integer, minimum: 1, maximum: 600, default: 60}
                row_limit: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FleetRun"}
        default: {$ref: "#/components/responses/Error"}
    get:
      tags: [Fleet]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Your recent fleet runs
      responses:
        "200":
          description: Runs, newest first (up to 50)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/FleetRun"}}
        default: {$ref: "#/components/responses/Error"}

  /v1/fleet-runs/{id}:
    get:
      tags: [Fleet]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceID"}]
      summary: A fleet run
      description: Only the user who started a run can see it.
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FleetRun"}
        default: {$ref: "#/components/responses/Error"}

  /v1/fleet-runs/{id}/targets:
    get:
      tags: [Fleet]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceID"}]
      summary: A fleet run's databases and their results
      responses:
        "200":
          description: Targets in order
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/FleetTarget"}}
        default: {$ref: "#/components/responses/Error"}

  /v1/fleet-runs/{id}/results.csv:
    get:
      tags: [Fleet]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceID"}]
      summary: Merged results as CSV
      description: >-
        The first result set of every database that returned rows, merged into one table whose columns are the union
        of theirs, led by database and server.
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/fleet-runs/{id}/resume:
    post:
      tags: [Fleet]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceID"}]
      summary: Continue a run paused after its first database
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FleetRun"}
        "409": {description: The run is not paused}
        default: {$ref: "#/components/responses/Error"}

  /v1/fleet-runs/{id}/cancel:
    post:
      tags: [Fleet]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceID"}]
      summary: Cancel a run
      description: Databases not started are skipped; statements running are killed on their server.
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FleetRun"}
        "409": {description: The run is over}
        default: {$ref: "#/components/responses/Error"}

  /v1/fleet-runs/{id}/retry:
    post:
      tags: [Fleet]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: "#/components/parameters/ResourceID"}]
      summary: Retry the databases that did not succeed
      description: Re-queues a failed or canceled run's failed, skipped, canceled and interrupted databases.
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FleetRun"}
        "409": {description: "The run is still going, or nothing is left to retry"}
        default: {$ref: "#/components/responses/Error"}

  /v1/schema/compare:
    post:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Compare two schemas and write the migration script
      description: >-
        Compares the target database with the source (a database as it is now, or one of its snapshots) and returns the
        differences plus the DDL that makes the target match. Dropping tables and columns is left commented out for
        review. Both databases must be on the same engine; both need database:read and data access, and are read as
        the caller's data login sees them. Nothing is executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_database_id, target_database_id]
              properties:
                source_database_id: {type: string, format: uuid}
                source_snapshot_id: {type: string, format: uuid, description: Compare against this snapshot of the source instead of its current schema.}
                target_database_id: {type: string, format: uuid}
      responses:
        "200":
          description: Comparison
          content:
            application/json:
              schema:
                type: object
                properties:
                  same: {type: boolean}
                  source_hash: {type: string}
                  target_hash: {type: string}
                  warnings: {type: array, items: {type: string}}
                  sql: {type: string, description: The migration script; empty when the schemas match.}
                  changes: {type: array, items: {$ref: "#/components/schemas/SchemaChange"}}
                  review: {type: integer, description: Steps left commented out or needing a manual change.}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/index-insights:
    get:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Unused and redundant indexes
      description: >-
        Every index of the database with its size and how often it was used since statistics started
        (pg_stat_user_indexes; performance_schema or, on MariaDB, userstat). Indexes never used, and indexes
        whose columns repeat or are a leftmost prefix of another index on the same table, are listed with a
        DROP statement to review and run in the console; nothing is dropped automatically. When the server
        keeps no usage counters, usage_available is false and note says how to enable them.
      responses:
        "200":
          description: Index insights
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IndexInsights"}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/explain:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Explain a statement
      description: >-
        Returns the plan of exactly one statement as JSON (PostgreSQL EXPLAIN FORMAT JSON, MySQL/MariaDB EXPLAIN
        FORMAT=JSON). Without analyze nothing is executed; explaining a write still needs database:write. With
        analyze (reads only) the statement runs in a read-only transaction that is rolled back, and the plan has
        actual rows and timings — MySQL returns its EXPLAIN ANALYZE tree as text (format mysql-tree).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql: {type: string}
                analyze: {type: boolean, default: false}
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  format: {type: string, enum: [postgres, mysql, mariadb, mysql-tree]}
                  analyzed: {type: boolean}
                  plan: {description: "The engine's JSON plan, as returned by the server."}
                  text: {type: string, description: The plan as text (mysql-tree).}
        default: {$ref: "#/components/responses/Error"}

  /v1/instances/{id}/top-queries:
    get:
      tags: [Instances]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: database, in: query, schema: {type: string}, description: Only statements run in this database.}
        - {name: sort, in: query, schema: {type: string, enum: [total, mean, calls], default: total}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      summary: Most expensive statements
      description: >-
        Normalized statements (literals replaced by placeholders) with call counts and time spent, from
        pg_stat_statements or performance_schema. When the server does not collect them, available is false and
        note says how to enable it.
      responses:
        "200":
          description: Statement statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: {type: boolean}
                  note: {type: string}
                  stats_since: {type: string, format: date-time}
                  queries:
                    type: array
                    items:
                      type: object
                      properties:
                        database: {type: string}
                        query: {type: string}
                        calls: {type: integer}
                        total_ms: {type: number}
                        mean_ms: {type: number}
                        rows: {type: integer}
                        rows_examined: {type: integer, description: MySQL/MariaDB only.}
                        no_index_used: {type: integer, description: Runs without a good index (MySQL/MariaDB).}
                        cache_hit_pct: {type: number, description: Shared-buffer hit ratio (PostgreSQL).}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/changes:
    get:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: table, in: query, schema: {type: string}}
        - {name: batch_id, in: query, schema: {type: string, format: uuid}}
        - {name: before, in: query, schema: {type: string, format: date-time}, description: Cursor - entries created before this time.}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      summary: Row change journal
      description: >-
        Data-browser edits of this database, newest first, with the row before and after (an update keeps only
        the columns it set, plus the key). Values are null, text, or {"b64": "..."} for binary. Entries are kept
        for FLEETDOCK_ROW_CHANGE_RETENTION. Requires the same access as browsing the database.
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/RowChange"}}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/changes/{changeId}/undo:
    post:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: changeId, in: path, required: true, schema: {type: string, format: uuid}}
      summary: Undo one row change
      description: >-
        Reverts the change if the row still looks as the change left it; otherwise the result has conflict=true and
        nothing is written, unless force is set (which overwrites the later change). The undo is journaled too.
        Requires database:write.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: {type: boolean, default: false}
      responses:
        "200":
          description: Outcome
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UndoResult"}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/changes/undo:
    post:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Undo a whole save
      description: Reverts every not yet undone change with this batch_id, newest first, and reports each. Requires database:write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch_id]
              properties:
                batch_id: {type: string, format: uuid}
                force: {type: boolean, default: false}
      responses:
        "200":
          description: One outcome per change
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/UndoResult"}}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/backup-copies:
    get:
      tags: [Backups]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: List backup copies
      description: The database's backups opened for comparison that are not dropped yet, newest first.
      responses:
        "200":
          description: Copies
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/BackupCopy"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [Backups]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Open a backup for comparison
      description: >-
        Restores a completed backup of this database into a temporary database (fds_...) on the same instance,
        kept for FLEETDOCK_BACKUP_COPY_TTL (2h by default, extendable up to 24h) and then dropped. One copy per
        database at a time. Needs backup:write and data access to the database. Poll the copy until status is
        ready (or failed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup_id]
              properties:
                backup_id: {type: string, format: uuid}
      responses:
        "202":
          description: Restoring
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackupCopy"}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/backup-copies/{copyId}:
    get:
      tags: [Backups]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: copyId, in: path, required: true, schema: {type: string, format: uuid}}
      summary: Get a backup copy
      responses:
        "200":
          description: Copy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackupCopy"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [Backups]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: copyId, in: path, required: true, schema: {type: string, format: uuid}}
      summary: Discard a backup copy
      description: Drops the temporary database now (as soon as its restore ends, if it is still restoring).
      responses:
        "204":
          description: Dropping
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/backup-copies/{copyId}/extend:
    post:
      tags: [Backups]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: copyId, in: path, required: true, schema: {type: string, format: uuid}}
      summary: Keep a backup copy longer
      description: Moves the expiry to one TTL from now, at most 24 hours after the copy became ready.
      responses:
        "200":
          description: Copy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BackupCopy"}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/backup-copies/{copyId}/diff:
    post:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: copyId, in: path, required: true, schema: {type: string, format: uuid}}
      summary: Compare a table with the backup copy
      description: >-
        One step of a comparison by row key: up to 1000 rows per call. The first phase scans the live table and finds
        rows added or changed since the backup; the second scans the copy and finds rows removed since. Call again with
        `next` until it is absent. Only columns both sides have are compared. Needs data access to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table]
              properties:
                table: {type: string}
                cursor: {$ref: "#/components/schemas/DiffCursor"}
      responses:
        "200":
          description: Differences found in this step
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns: {type: array, items: {type: string}}
                  key: {type: array, items: {type: string}}
                  scanned: {type: integer}
                  warnings: {type: array, items: {type: string}}
                  next: {$ref: "#/components/schemas/DiffCursor"}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: {type: string, enum: [added, removed, changed]}
                        key: {type: object, additionalProperties: true}
                        live: {type: array, items: {type: string, nullable: true}}
                        backup: {type: array, items: {type: string, nullable: true}}
                        changed: {type: array, items: {type: string}}
                        live_hash: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/backup-copies/{copyId}/restore-rows:
    post:
      tags: [Data]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - {name: copyId, in: path, required: true, schema: {type: string, format: uuid}}
      summary: Put rows back as they were in the backup
      description: >-
        Changed rows get the backup's values, removed rows are inserted again and added rows are deleted - each only if
        it still looks as it did when compared (otherwise conflict). Every row is journaled under one batch_id, so the
        whole restore can be undone from the change history. At most 200 rows per call. Requires database:write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table, rows]
              properties:
                table: {type: string}
                rows:
                  type: array
                  items:
                    type: object
                    properties:
                      key: {type: object, additionalProperties: true}
                      kind: {type: string, enum: [added, removed, changed]}
                      live_hash: {type: string}
      responses:
        "200":
          description: One outcome per row
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id: {type: string, format: uuid}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key: {type: object, additionalProperties: true}
                        ok: {type: boolean}
                        conflict: {type: boolean}
                        error: {type: string}
                        change_id: {type: string, format: uuid}
        default: {$ref: "#/components/responses/Error"}

  /v1/search/schema:
    get:
      tags: [Databases]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Search table and column names across the fleet
      description: >-
        Matches table, view and column names in every database Fleetdock indexes (refreshed every
        FLEETDOCK_CATALOG_REFRESH_INTERVAL and after DDL made through Fleetdock). Exact names rank first,
        then prefixes, then substrings; tables before columns. Only databases the caller could open in the
        data browser are included. Queries shorter than two characters return nothing.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/SchemaSearchHit"}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/tables/{table}/indexes/drop:
    post:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Drop index
      description: An index backing a constraint is dropped by dropping the constraint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
      responses:
        "200":
          description: Dropped
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/tables/{table}/indexes:
    post:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Create index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                columns: {type: array, items: {type: string}}
                unique: {type: boolean}
      responses:
        "201":
          description: Created
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/tables/{table}/rename:
    post:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Rename table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_name: {type: string}
      responses:
        "200":
          description: Renamed
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/tables/{table}/truncate:
    post:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Truncate table
      responses:
        "200":
          description: Done
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/tables/{table}/drop:
    post:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Drop table
      responses:
        "200":
          description: Done
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/tables/{table}:
    patch:
      tags: [Structure]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Alter table
      description: >
        Applies column and foreign-key changes atomically (one ALTER TABLE on
        MySQL/MariaDB, one transaction on PostgreSQL). On MySQL/MariaDB a change
        cannot refer to a column added or renamed earlier in the same request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ops:
                  type: array
                  items: {$ref: "#/components/schemas/AlterOp"}
      responses:
        "200":
          description: Altered
        default: {$ref: "#/components/responses/Error"}

  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: OK
        default: {$ref: "#/components/responses/Error"}

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe (metadata DB)
      responses:
        "200":
          description: Ready
        "503":
          description: Unavailable (the metadata database, or the background worker has stopped)
        default: {$ref: "#/components/responses/Error"}

  /v1/version:
    get:
      tags: [Health]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Running version
      description: >
        The control plane's version and commit, and the oldest agent version
        it still supports. Servers report `agent_status` against these.
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                required: [version, min_agent_version]
                properties:
                  version: {type: string, example: "0.10.0", description: '"dev" for a build without a version'}
                  commit: {type: string, example: "e7d37df1a2b3"}
                  date: {type: string}
                  min_agent_version: {type: string, example: "0.1.0"}
        default: {$ref: "#/components/responses/Error"}

  /metrics:
    get:
      tags: [Health]
      security: [{metricsAuth: []}]
      summary: Prometheus metrics
      description: >
        The control plane's metrics in the Prometheus text format: build,
        HTTP requests and latency, finished operations, the worker's last
        run, and fleet gauges (servers, database servers, databases,
        backups, operations). Enabled by FLEETDOCK_METRICS_TOKEN, which the
        scraper sends as a bearer token; 404 while it is unset.
      responses:
        "200":
          description: Metrics
          content:
            text/plain:
              schema: {type: string}
        "404":
          description: Metrics are not enabled
        default: {$ref: "#/components/responses/Error"}

  /openapi.yaml:
    get:
      tags: [Docs]
      summary: This OpenAPI specification (YAML)
      responses:
        "200":
          description: OpenAPI document
        default: {$ref: "#/components/responses/Error"}

  /docs:
    get:
      tags: [Docs]
      summary: Interactive API documentation (Redoc)
      responses:
        "200":
          description: HTML docs page
        default: {$ref: "#/components/responses/Error"}

  /install.sh:
    get:
      tags: [Install]
      summary: Agent install script
      responses:
        "200":
          description: Shell script
        default: {$ref: "#/components/responses/Error"}

  /agent/v1/binary/{os}/{arch}:
    get:
      tags: [Agent]
      summary: Download agent binary
      parameters:
        - name: os
          in: path
          required: true
          schema:
            type: string
        - name: arch
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Binary
        default: {$ref: "#/components/responses/Error"}

  /agent/v1/binary/{os}/{arch}/sha256:
    get:
      tags: [Agent]
      summary: Agent binary checksum
      description: The SHA-256 of the binary, as hex; `install.sh` checks downloads against it.
      parameters:
        - {name: os, in: path, required: true, schema: {type: string}}
        - {name: arch, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Hex SHA-256 followed by a newline
          content:
            text/plain:
              schema: {type: string}
        "404":
          description: No binary for this platform
        default: {$ref: "#/components/responses/Error"}

