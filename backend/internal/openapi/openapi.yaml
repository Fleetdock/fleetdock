      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: table
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rows

    post:
      tags: [Data]
      security: [{bearerAuth: []}]
      summary: Insert a row
      description: Omitted columns take their defaults. Requires database:write.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values: {$ref: "#/components/schemas/RowValues"}
                batch_id: {type: string, format: uuid, description: Groups the edits of one save for undo.}
      responses:
        "201":
          description: Inserted; the journal entry that can undo it
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RowEditResult"}
    patch:
      tags: [Data]
      security: [{bearerAuth: []}]
      summary: Update one row
      description: >
        `key` must give every row-key column. The change must match exactly
        one row or nothing is written. Requires database:write.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {$ref: "#/components/schemas/RowValues"}
                values: {$ref: "#/components/schemas/RowValues"}
                batch_id: {type: string, format: uuid, description: Groups the edits of one save for undo.}
      responses:
        "200":
          description: Updated; the journal entry that can undo it
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RowEditResult"}

  /v1/databases/{id}/tables/{table}/schema:
