  /v1/audit-events:
    get:
      tags: [Audit]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: List audit events
      description: >-
        Who did what, newest first: sign-ins, access changes, changes to servers, databases, backups and
        notifications, writes from the SQL console and the data browser, structure changes and data exports.
        Requests refused for lack of permission are listed as `denied`. Needs `audit:read` (owners and admins).
        Events are kept for `FLEETDOCK_AUDIT_RETENTION` (365 days by default).
      parameters:
        - {name: actor, in: query, schema: {type: string, format: uuid}, description: Only events by this user.}
        - name: action
          in: query
          schema: {type: string}
          description: An exact action (`user.delete`), or a category ending with a dot (`user.`).
        - {name: resource_type, in: query, schema: {type: string}}
        - {name: resource_id, in: query, schema: {type: string, format: uuid}}
        - {name: outcome, in: query, schema: {type: string, enum: [success, denied, failure]}}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: Only events at or after this time.}
        - {name: until, in: query, schema: {type: string, format: date-time}, description: Only events before this time.}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: cursor, in: query, schema: {type: string}, description: next_cursor from the previous page.}
        - name: format
          in: query
          schema: {type: string, enum: [csv]}
          description: "`csv` downloads every matching event (up to 10000) as a CSV file instead of a page."
      responses:
        "200":
          description: A page of events (or a CSV file with format=csv)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AuditEvent"}
                  next_cursor: {type: string, description: Absent on the last page.}
            text/csv:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

