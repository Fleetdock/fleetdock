                name: {type: string}
                engine: {type: string, enum: [mariadb, mysql, postgres]}
                engine_version: {type: string}
                port: {type: integer}
                username: {type: string}
                password: {type: string, writeOnly: true}
                tls_mode:
                  type: string
                  enum: [disable, prefer, require, verify-full]
                labels: {type: object, additionalProperties: {type: string}}
                tags: {type: array, items: {type: string}}
                ssh_tunnel:
                  $ref: "#/components/schemas/SSHTunnelInput"
                data_access: {type: string, enum: [admin, login, managed], default: admin}
                data_username: {type: string}
                data_password: {type: string, writeOnly: true}
      responses:
        "201":
          description: Created

  /v1/instances/provision:
    post:
      tags: [Instances]
      security: [{bearerAuth: []}]
      summary: Provision managed instance
      responses:
        "202":
          description: Provisioning started

  /v1/instances/{id}:
    get:
      tags: [Instances]
      security: [{bearerAuth: []}]
      summary: Get instance
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Instance
    patch:
      tags: [Instances]
      security: [{bearerAuth: []}]
      summary: Update instance
      description: >
        Partial update. Omitted fields are left unchanged. `username: ""`
        clears the admin credentials entirely; `password: ""` removes the
        stored password but keeps the username. `host` is external-only and
        `port` cannot be changed on a provisioned instance. Changing `host`
        requires re-entering `password` (or clearing it), so the stored admin
        password is never sent to a new host. Loopback, link-local,
        cloud-metadata and control-plane addresses are refused. Behind an SSH
        tunnel the policy applies to the bastion instead, since the host is
        resolved there. `ssh_tunnel` sets or changes the tunnel (external
        only); its secret fields may be omitted to keep the stored ones while
        the bastion, user and auth method stay the same. Adding, moving or
        removing the tunnel requires re-entering `password`.
        `reset_ssh_host_key` forgets the pinned bastion host key.
        `data_access` selects the login used for data browsing (see
        Instance); with `login`, `data_password` may be omitted to keep the
        stored one, except when the data username, host or tunnel changes.
        Switching away from `login` deletes the stored data login.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                host: {type: string}
                port: {type: integer}
                tls_mode:
                  type: string
                  enum: [disable, prefer, require, verify-full]
                username: {type: string}
                password: {type: string, writeOnly: true}
                ssh_tunnel:
                  $ref: "#/components/schemas/SSHTunnelInput"
                remove_ssh_tunnel: {type: boolean}
                reset_ssh_host_key: {type: boolean}
                data_access: {type: string, enum: [admin, login, managed]}
                data_username: {type: string}
                data_password: {type: string, writeOnly: true}
      responses:
        "200":
          description: Updated instance
    delete:
      tags: [Instances]
      security: [{bearerAuth: []}]
      summary: Delete instance
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Deleted

