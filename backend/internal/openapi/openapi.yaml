      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {$ref: "#/components/schemas/RowValues"}
                batch_id: {type: string, format: uuid, description: Groups the edits of one save for undo.}
      responses:
        "200":
          description: Deleted; the journal entry that can undo it
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RowEditResult"}

  /v1/databases/{id}/tables/{table}/import:
    post:
      tags: [Data]
      security: [{bearerAuth: []}]
      summary: Import CSV
      description: >
        The body is the CSV itself (max 100 MB). Its header row names table
        columns. The import runs in one transaction: any bad row aborts it.
        A field of exactly `\N` is NULL. Requires database:write.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
        - name: empty_as_null
          in: query
          schema: {type: boolean}
          description: Load empty fields as NULL instead of empty strings.
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
      responses:
        "200":
          description: Rows imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: {type: integer, format: int64}

  /v1/databases/{id}/tables/{table}/export:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Export table CSV
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: table
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export URL

  /v1/databases/{id}/query:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: SQL query console
      description: >
        Runs one or more statements (split on `;` outside literals, comments
        and dollar quotes; MySQL `DELIMITER` lines are honoured) in order on
        one session, stopping at the first failure. Reads run as the
        database's read-only role; a script with any write runs as its
        read-write role and requires database:write (checked before anything
        runs). A failing first statement is returned as an error; a later
        failure returns the earlier results plus `error`. Pass `query_id` (a
        UUID you generate) to be able to cancel the run.

        With `preview: true` (database:write) the script is a dry run: it
        runs in one transaction that is always rolled back, and only SELECT,
        INSERT, UPDATE, DELETE, REPLACE and MERGE are allowed. Each write
        reports its row count; a single-table UPDATE or DELETE also returns
        a `sample` of up to 20 rows before and after. On MySQL/MariaDB a
        database with non-transactional tables (MyISAM, Aria, MEMORY) cannot
        be previewed. Previews are not kept in the history.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sql: {type: string}
                limit: {type: integer, maximum: 1000, default: 100, description: Rows returned per statement}
                query_id: {type: string, format: uuid}
                preview: {type: boolean, default: false, description: Dry run in a transaction that is rolled back.}
      responses:
        "200":
          description: Results of the statements that ran
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        columns: {type: array, items: {type: string}}
                        rows: {type: array, items: {type: array, items: {type: string, nullable: true}}}
                        row_count: {type: integer}
                        truncated: {type: boolean}
                        rows_affected: {type: integer, format: int64}
                        read_only: {type: boolean}
                        duration_ms: {type: integer, format: int64}
                        notes: {type: array, items: {type: string}, description: Preview caveats.}
                        sample:
                          type: object
                          description: Preview only - rows before and after (after is null when deleted).
                          properties:
                            table: {type: string}
                            key: {type: array, items: {type: string}}
                            columns: {type: array, items: {type: string}}
                            truncated: {type: boolean}
                            rows:
                              type: array
                              items:
                                type: object
                                properties:
                                  before: {type: array, items: {type: string, nullable: true}}
                                  after: {type: array, nullable: true, items: {type: string, nullable: true}}
                  rolled_back: {type: boolean, description: A preview - nothing was saved.}
                  error:
                    type: object
                    properties:
                      statement: {type: integer, description: 1-based index of the failed statement}
                      message: {type: string}

  /v1/databases/{id}/export:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Export query results
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Export URL

  /v1/databases/{id}/dump/check:
    post:
      tags: [Backups]
      security: [{bearerAuth: []}]
      summary: Check a downloaded backup can start
      description: >
        Verifies that a one-off dump of the database can start: the dump tool
        is installed on the control plane and the database accepts the
        instance's admin login. Call it before `GET /v1/databases/{id}/dump`
        to report problems as an error instead of a failed download. Requires
        backup:write on the database.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: The dump can start

  /v1/databases/{id}/dump:
    get:
      tags: [Backups]
      security: [{bearerAuth: []}]
      summary: Download a one-off backup
      description: >
        Streams a gzip-compressed SQL dump of the database (the same
        `pg_dump` / `mariadb-dump` output a stored backup contains) straight
        to the client as `<database>-<YYYYMMDD-HHMMSS>.sql.gz`. Nothing is
        stored: no backup destination is needed and no backup record is
        created. Errors before the first byte return JSON; a failure
        mid-stream truncates the file, which its gzip trailer check exposes.
        Requires backup:write on the database.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: The dump
          content:
            application/gzip:
              schema: {type: string, format: binary}

