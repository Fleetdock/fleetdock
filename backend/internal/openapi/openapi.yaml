        by the row key last, so pages are stable. `key` names the columns that
        identify a row (empty when the table has no primary or NOT NULL unique
        key — such tables are read-only here). Runs as the database's
        read-only console role. Requires database:read.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrowseRequest"}
      responses:
        "200":
          description: A page of rows
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowseResult"}
        default: {$ref: "#/components/responses/Error"}

