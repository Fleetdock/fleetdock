openapi: 3.1.0
info:
  title: Fleetdock API
  version: 0.1.0
  description: |
    Self-hosted database control plane API. User routes require a Bearer JWT or
    API token (`fleetd_` prefix). Agent routes under `/agent/v1` use agent bearer
    tokens (`fleeta_` prefix).
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Users
  - name: Tokens
  - name: Overview
  - name: Servers
  - name: AgentTokens
    x-displayName: Agent tokens
  - name: Instances
  - name: Databases
  - name: DBAdmin
    x-displayName: Database admin
  - name: Operations
  - name: Backups
  - name: Destinations
  - name: Schedules
  - name: Moves
  - name: Notifications
  - name: Agent
  - name: Install
  - name: Docs

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    agentAuth:
      type: http
      scheme: bearer
      description: Agent bearer token (fleeta_ prefix)

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TableName:
      name: table
      in: path
      required: true
      description: Table name; on PostgreSQL schema-qualified ("public.orders").
      schema:
        type: string

  schemas:
    ColumnSpec:
      type: object
      properties:
        name: {type: string}
        type: {type: string, example: "varchar(100)"}
        nullable: {type: boolean}
        default: {type: string, nullable: true}
        default_is_expression: {type: boolean}
        auto_increment: {type: boolean}
        comment: {type: string}
        keep_default:
          type: boolean
          description: modify_column only — keep the current default (and MySQL AUTO_INCREMENT / ON UPDATE).
    ForeignKey:
      type: object
      properties:
        name: {type: string}
        columns: {type: array, items: {type: string}}
        ref_table: {type: string}
        ref_columns: {type: array, items: {type: string}}
        on_delete: {type: string, enum: ["", CASCADE, SET NULL, RESTRICT, NO ACTION]}
        on_update: {type: string, enum: ["", CASCADE, SET NULL, RESTRICT, NO ACTION]}
    TableSpec:
      type: object
      properties:
        name: {type: string}
        columns: {type: array, items: {$ref: "#/components/schemas/ColumnSpec"}}
        primary_key: {type: array, items: {type: string}}
        foreign_keys: {type: array, items: {$ref: "#/components/schemas/ForeignKey"}}
        comment: {type: string}
    AlterOp:
      type: object
      properties:
        op: {type: string, enum: [add_column, drop_column, modify_column, rename_column, add_foreign_key, drop_foreign_key]}
        name: {type: string, description: Existing column or constraint}
        new_name: {type: string}
        column: {$ref: "#/components/schemas/ColumnSpec"}
        foreign_key: {$ref: "#/components/schemas/ForeignKey"}
    RowValues:
      type: object
      description: Column name to value; null is SQL NULL.
      additionalProperties: {type: string, nullable: true}
    BrowseRequest:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            properties:
              column: {type: string}
              op:
                type: string
                enum: [eq, ne, lt, lte, gt, gte, contains, starts_with, is_null, not_null]
              value: {type: string, nullable: true}
        sort:
          type: array
          items:
            type: object
            properties:
              column: {type: string}
              desc: {type: boolean}
        search: {type: string, description: Case-insensitive match on any column}
        limit: {type: integer, maximum: 500, default: 50}
        offset: {type: integer}
    BrowseResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              type: {type: string}
              nullable: {type: boolean}
              has_default: {type: boolean}
        rows:
          type: array
          items:
            type: array
            items: {type: string, nullable: true}
        total: {type: integer, format: int64}
        total_exact: {type: boolean}
        total_capped: {type: boolean}
        key:
          type: array
          items: {type: string}
    Process:
      type: object
      properties:
        id: {type: integer, format: int64}
        user: {type: string}
        host: {type: string}
        database: {type: string, nullable: true}
        state: {type: string}
        seconds: {type: integer, format: int64}
        query: {type: string, nullable: true}
    Setting:
      type: object
      properties:
        name: {type: string}
        value: {type: string}
    InstanceHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unreachable, unknown]
        version: {type: string}
        latency_ms: {type: integer}
        error: {type: string}
        checked_at: {type: string, format: date-time}
    Error:
      type: object
      properties:
        error:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
    Server:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
        status:
          type: string
    Instance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        engine:
          type: string
          enum: [mariadb, mysql, postgres]
        kind:
          type: string
          enum: [managed, external]
        tls_mode:
          type: string
          enum: [disable, prefer, require, verify-full]
          description: How the control plane secures connections to the instance.
        health:
          $ref: "#/components/schemas/InstanceHealth"
    InstanceRef:
      type: object
      description: >
        Summary of the instance a database lives on, embedded in list and get
        responses so clients need no second request to resolve the name.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        engine:
          type: string
        kind:
          type: string
          enum: [managed, external]
        server_id:
          type: string
          format: uuid
          nullable: true
        provisioned:
          type: boolean
        has_credentials:
          type: boolean
    Database:
      type: object
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        instance:
          $ref: "#/components/schemas/InstanceRef"
        name:
          type: string
        status:
          type: string
    Backup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        database_name:
          type: string
          description: Name of the backed-up database.
        instance_name:
          type: string
          description: Name of the database server it lives on.
    Operation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
        resource_name:
          type: string
          description: Display name of the resource (for a backup, its database).

paths:
  /v1/saved-queries/{id}:
    patch:
      tags: [Console]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Update a saved query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                sql: {type: string}
                database_id: {type: string, format: uuid, nullable: true}
      responses:
        "200":
          description: Updated
    delete:
      tags: [Console]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Delete a saved query
      responses:
        "204":
          description: Deleted

  /v1/saved-queries:
    get:
      tags: [Console]
      security: [{bearerAuth: []}]
      summary: Your saved queries
      parameters:
        - name: database_id
          in: query
          schema: {type: string, format: uuid}
          description: Limit to this database's queries plus unscoped ones.
      responses:
        "200":
          description: Saved queries
    post:
      tags: [Console]
      security: [{bearerAuth: []}]
      summary: Save a query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                sql: {type: string}
                database_id: {type: string, format: uuid, nullable: true}
      responses:
        "201":
          description: Saved

  /v1/instances/{id}/db-users/password:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Set a database account's password
      description: >
        Refused for the instance's own admin login (edit the instance instead) and
        for Fleetdock-managed console roles. PostgreSQL passwords are sent as
        SCRAM verifiers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string}
                host: {type: string}
                password: {type: string, writeOnly: true}
      responses:
        "200":
          description: Changed

  /v1/databases/{id}/import-sql:
    post:
      tags: [Backups]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: destination_id
          in: query
          required: true
          schema: {type: string, format: uuid}
          description: Backup destination used to stage the file for the executor.
        - name: gzip
          in: query
          schema: {type: boolean}
          description: The body is already gzip-compressed.
      summary: Import a SQL file
      description: >
        Applies a SQL dump (max 2 GB) to the database through the restore path,
        running as the database's read-write role — never as the instance admin.
        The staged file is deleted afterwards. Requires database:write and
        backup:write.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "202":
          description: Import operation started

  /v1/databases/{id}/query-history:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Your console history for this database
      description: The caller's most recent runs (up to 200 are kept per database).
      responses:
        "200":
          description: History

  /v1/databases/{id}/query/{qid}/cancel:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: qid
          in: path
          required: true
          schema: {type: string, format: uuid}
      summary: Cancel a running console query
      description: >
        Only the user who started the query can cancel it. The statement is
        killed on the database server as well.
      responses:
        "202":
          description: Cancelling

  /v1/backups/{id}/verify:
    post:
      tags: [Backups]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Verify backup (test restore)
      description: >
        Restores the backup into a throwaway database on its instance (checking the
        checksum and that tables come back), records the outcome on the backup
        (`verify_status`, `verified_at`, `verify_error`) and drops the throwaway
        database. Requires backup:write.
      responses:
        "202":
          description: Verification operation started

  /v1/backups/{id}/download:
    get:
      tags: [Backups]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Download link
      description: >
        Returns a presigned link (valid 15 minutes) to the backup's gzipped SQL
        dump, downloaded directly from the bucket. Requires backup:read.
      responses:
        "200":
          description: Link
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
                  expires_at: {type: string, format: date-time}

  /v1/databases/{id}/objects:
    get:
      tags: [Structure]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: List views, routines, triggers, sequences and events
      responses:
        "200":
          description: Schema objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: {type: string, enum: [view, materialized_view, function, procedure, trigger, sequence, event]}
                        schema: {type: string}
                        name: {type: string}
                        table: {type: string}
                        definition: {type: string, nullable: true}

  /v1/databases/{id}/tables/{table}/foreign-keys:
    get:
      tags: [Structure]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: List foreign keys
      responses:
        "200":
          description: Foreign keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ForeignKey"}

  /v1/databases/{id}/tables/{table}/indexes/drop:
    post:
      tags: [Structure]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Drop index
      description: An index backing a constraint is dropped by dropping the constraint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
      responses:
        "200":
          description: Dropped

  /v1/databases/{id}/tables/{table}/indexes:
    post:
      tags: [Structure]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Create index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                columns: {type: array, items: {type: string}}
                unique: {type: boolean}
      responses:
        "201":
          description: Created

  /v1/databases/{id}/tables/{table}/rename:
    post:
      tags: [Structure]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Rename table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_name: {type: string}
      responses:
        "200":
          description: Renamed

  /v1/databases/{id}/tables/{table}/truncate:
    post:
      tags: [Structure]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Truncate table
      responses:
        "200":
          description: Done

  /v1/databases/{id}/tables/{table}/drop:
    post:
      tags: [Structure]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Drop table
      responses:
        "200":
          description: Done

  /v1/databases/{id}/tables/{table}:
    patch:
      tags: [Structure]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      summary: Alter table
      description: >
        Applies column and foreign-key changes atomically (one ALTER TABLE on
        MySQL/MariaDB, one transaction on PostgreSQL). On MySQL/MariaDB a change
        cannot refer to a column added or renamed earlier in the same request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ops:
                  type: array
                  items: {$ref: "#/components/schemas/AlterOp"}
      responses:
        "200":
          description: Altered

  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: OK

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe (metadata DB)
      responses:
        "200":
          description: Ready
        "503":
          description: Unavailable

  /openapi.yaml:
    get:
      tags: [Docs]
      summary: This OpenAPI specification (YAML)
      responses:
        "200":
          description: OpenAPI document

  /docs:
    get:
      tags: [Docs]
      summary: Interactive API documentation (Redoc)
      responses:
        "200":
          description: HTML docs page

  /install.sh:
    get:
      tags: [Install]
      summary: Agent install script
      responses:
        "200":
          description: Shell script

  /agent/v1/binary/{os}/{arch}:
    get:
      tags: [Agent]
      summary: Download agent binary
      parameters:
        - name: os
          in: path
          required: true
          schema:
            type: string
        - name: arch
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Binary

  /agent/v1/register:
    post:
      tags: [Agent]
      summary: Enroll agent with registration token
      responses:
        "200":
          description: Enrolled

  /agent/v1/heartbeat:
    post:
      tags: [Agent]
      security: [{agentAuth: []}]
      summary: Agent heartbeat
      responses:
        "200":
          description: OK

  /agent/v1/jobs/claim:
    post:
      tags: [Agent]
      security: [{agentAuth: []}]
      summary: Claim next pending job
      responses:
        "200":
          description: Job or empty

  /agent/v1/jobs/{id}/status:
    post:
      tags: [Agent]
      security: [{agentAuth: []}]
      summary: Update job status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated

  /agent/v1/jobs/{id}/logs:
    post:
      tags: [Agent]
      security: [{agentAuth: []}]
      summary: Append job logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Appended

  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /v1/auth/me:
    get:
      tags: [Auth]
      security: [{bearerAuth: []}]
      summary: Current user
      responses:
        "200":
          description: User profile

  /v1/auth/logout:
    post:
      tags: [Auth]
      security: [{bearerAuth: []}]
      summary: Log out
      description: >
        Invalidates every browser session (JWT) issued to the caller so far,
        on all devices. API tokens are not affected.
      responses:
        "204":
          description: Logged out

  /v1/profile:
    get:
      tags: [Profile]
      security: [{bearerAuth: []}]
      summary: Get profile
      responses:
        "200":
          description: Profile
    patch:
      tags: [Profile]
      security: [{bearerAuth: []}]
      summary: Update profile
      responses:
        "200":
          description: Updated

  /v1/profile/password:
    post:
      tags: [Profile]
      security: [{bearerAuth: []}]
      summary: Change own password
      responses:
        "200":
          description: Changed

  /v1/users:
    get:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: List users
      responses:
        "200":
          description: User list
    post:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: Create user
      responses:
        "201":
          description: Created

  /v1/users/{id}:
    patch:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Updated
    delete:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: Delete user
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Deleted

  /v1/users/{id}/password:
    post:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: Reset user password
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Reset

  /v1/users/{id}/role-grants:
    get:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: List a user's role grants (global and scoped)
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Grants
    post:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: Grant a role to a user at a scope (global, server or database)
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "201":
          description: Granted

  /v1/users/{id}/role-grants/{grantId}:
    delete:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: Revoke a user's role grant
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: grantId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Revoked

  /v1/roles:
    get:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: List roles
      responses:
        "200":
          description: Roles
    post:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: Create role
      responses:
        "201":
          description: Created

  /v1/roles/{id}:
    patch:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: Update role
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Updated
    delete:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: Delete role
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Deleted

  /v1/permissions:
    get:
      tags: [Users]
      security: [{bearerAuth: []}]
      summary: Permission catalog
      responses:
        "200":
          description: Permissions

  /v1/overview:
    get:
      tags: [Overview]
      security: [{bearerAuth: []}]
      summary: Fleet overview dashboard
      description: |
        Fleet-wide counts, first-run setup progress, and up to 20 open problems
        ("attention") the caller is allowed to see, critical first.
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup:
                    type: object
                    properties:
                      servers: {type: integer}
                      instances: {type: integer}
                      destinations: {type: integer}
                      schedules: {type: integer}
                      channels: {type: integer}
                  attention:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      required: [kind, severity, resource_type, resource_id, name, message, since]
                      properties:
                        kind:
                          type: string
                          enum: [server_offline, instance_unreachable, backup_failed, backup_check_failed, no_recent_backup, database_missing, operation_failed]
                        severity: {type: string, enum: [critical, warning]}
                        resource_type: {type: string, enum: [server, instance, database, backup, operation]}
                        resource_id: {type: string, format: uuid}
                        name: {type: string}
                        message: {type: string}
                        since: {type: string, format: date-time}

