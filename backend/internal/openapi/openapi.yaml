        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/query:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: SQL query console
      description: >
        Runs one or more statements (split on `;` outside literals, comments
        and dollar quotes; MySQL `DELIMITER` lines are honoured) in order on
        one session, stopping at the first failure. Reads run as the
        database's read-only role; a script with any write runs as its
        read-write role and requires database:write (checked before anything
        runs). A failing first statement is returned as an error; a later
        failure returns the earlier results plus `error`. Pass `query_id` (a
        UUID you generate) to be able to cancel the run.

        With `preview: true` (database:write) the script is a dry run: it
        runs in one transaction that is always rolled back, and only SELECT,
        INSERT, UPDATE, DELETE, REPLACE and MERGE are allowed. Each write
        reports its row count; a single-table UPDATE or DELETE also returns
        a `sample` of up to 20 rows before and after. On MySQL/MariaDB a
        database with non-transactional tables (MyISAM, Aria, MEMORY) cannot
        be previewed. Previews are not kept in the history.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sql: {type: string}
                limit: {type: integer, maximum: 5000, default: 100, description: Rows returned per statement (larger values are capped at 5000)}
                query_id: {type: string, format: uuid}
                preview: {type: boolean, default: false, description: Dry run in a transaction that is rolled back.}
      responses:
        "200":
          description: Results of the statements that ran
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        columns: {type: array, items: {type: string}}
                        rows: {type: array, items: {type: array, items: {type: string, nullable: true}}}
                        row_count: {type: integer}
                        truncated: {type: boolean}
                        rows_affected: {type: integer, format: int64}
                        read_only: {type: boolean}
                        duration_ms: {type: integer, format: int64}
                        notes: {type: array, items: {type: string}, description: Preview caveats.}
                        sample:
                          type: object
                          description: Preview only - rows before and after (after is null when deleted).
                          properties:
                            table: {type: string}
                            key: {type: array, items: {type: string}}
                            columns: {type: array, items: {type: string}}
                            truncated: {type: boolean}
                            rows:
                              type: array
                              items:
                                type: object
                                properties:
                                  before: {type: array, items: {type: string, nullable: true}}
                                  after: {type: array, nullable: true, items: {type: string, nullable: true}}
                  rolled_back: {type: boolean, description: A preview - nothing was saved.}
                  error:
                    type: object
                    properties:
                      statement: {type: integer, description: 1-based index of the failed statement}
                      message: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/databases/{id}/export:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      summary: Export query results
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Export URL
        default: {$ref: "#/components/responses/Error"}

