      security: [{bearerAuth: []}]
      summary: List tables
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Tables
    post:
      tags: [Structure]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      summary: Create table
      description: >
        Creates a table from a typed spec (no SQL). Column types come from an
        allowlist; defaults are quoted literals or allowlisted expressions.
        On PostgreSQL `name` may be "schema.table". Requires database:write.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TableSpec"}
      responses:
        "201":
          description: Created

  /v1/databases/{id}/tables/{table}/rows:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Browse table rows
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: table
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rows

    post:
      tags: [Data]
      security: [{bearerAuth: []}]
      summary: Insert a row
      description: Omitted columns take their defaults. Requires database:write.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values: {$ref: "#/components/schemas/RowValues"}
      responses:
        "201":
          description: Inserted
    patch:
      tags: [Data]
      security: [{bearerAuth: []}]
      summary: Update one row
      description: >
        `key` must give every row-key column. The change must match exactly
        one row or nothing is written. Requires database:write.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {$ref: "#/components/schemas/RowValues"}
                values: {$ref: "#/components/schemas/RowValues"}
      responses:
        "200":
          description: Updated

  /v1/databases/{id}/tables/{table}/schema:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Table schema
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: table
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema

  /v1/databases/{id}/tables/{table}/browse:
    post:
      tags: [Data]
      security: [{bearerAuth: []}]
      summary: Browse rows with filters and sorting
      description: >
        Returns a page of rows. Filters and sort columns are validated against
        the table; values are bound as parameters. Results are always ordered
        by the row key last, so pages are stable. `key` names the columns that
        identify a row (empty when the table has no primary or NOT NULL unique
        key — such tables are read-only here). Runs as the database's
        read-only console role. Requires database:read.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrowseRequest"}
      responses:
        "200":
          description: A page of rows
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrowseResult"}

  /v1/databases/{id}/tables/{table}/rows/delete:
    post:
      tags: [Data]
      security: [{bearerAuth: []}]
      summary: Delete one row
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {$ref: "#/components/schemas/RowValues"}
      responses:
        "200":
          description: Deleted

  /v1/databases/{id}/tables/{table}/import:
    post:
      tags: [Data]
      security: [{bearerAuth: []}]
      summary: Import CSV
      description: >
        The body is the CSV itself (max 100 MB). Its header row names table
        columns. The import runs in one transaction: any bad row aborts it.
        A field of exactly `\N` is NULL. Requires database:write.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
        - name: empty_as_null
          in: query
          schema: {type: boolean}
          description: Load empty fields as NULL instead of empty strings.
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
      responses:
        "200":
          description: Rows imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: {type: integer, format: int64}

  /v1/databases/{id}/tables/{table}/export:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Export table CSV
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: table
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export URL

  /v1/databases/{id}/query:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: SQL query console
      description: >
        Runs one or more statements (split on `;` outside literals, comments
        and dollar quotes; MySQL `DELIMITER` lines are honoured) in order on
        one session, stopping at the first failure. Reads run as the
        database's read-only role; a script with any write runs as its
        read-write role and requires database:write (checked before anything
        runs). A failing first statement is returned as an error; a later
        failure returns the earlier results plus `error`. Pass `query_id` (a
        UUID you generate) to be able to cancel the run.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sql: {type: string}
                limit: {type: integer, maximum: 1000, default: 100, description: Rows returned per statement}
                query_id: {type: string, format: uuid}
      responses:
        "200":
          description: Results of the statements that ran
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        columns: {type: array, items: {type: string}}
                        rows: {type: array, items: {type: array, items: {type: string, nullable: true}}}
                        row_count: {type: integer}
                        truncated: {type: boolean}
                        rows_affected: {type: integer, format: int64}
                        read_only: {type: boolean}
                        duration_ms: {type: integer, format: int64}
                  error:
                    type: object
                    properties:
                      statement: {type: integer, description: 1-based index of the failed statement}
                      message: {type: string}

  /v1/databases/{id}/export:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Export query results
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Export URL

