      summary: Import CSV
      description: >
        The body is the CSV itself (max 100 MB). Its header row names table
        columns. The import runs in one transaction: any bad row aborts it.
        A field of exactly `\N` is NULL. Requires database:write.
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/TableName"
        - name: empty_as_null
          in: query
          schema: {type: boolean}
          description: Load empty fields as NULL instead of empty strings.
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
      responses:
        "200":
          description: Rows imported
          content:
            application/json:
              schema:
