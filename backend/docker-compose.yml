# Local development stack: Postgres + the API service.
# Usage: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mdcp
      POSTGRES_PASSWORD: mdcp
      POSTGRES_DB: mdcp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdcp -d mdcp"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      MDCP_HTTP_ADDR: ":8080"
      MDCP_DATABASE_URL: "postgres://mdcp:mdcp@postgres:5432/mdcp?sslmode=disable"
      MDCP_RUN_MIGRATIONS: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
