name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

      - name: build
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # Deliberately no NEXT_PUBLIC_API_URL: the dashboard must build without
      # one and call the API on its own origin. This is the standing guard
      # against re-introducing a build-time-baked API host.
      - name: build
        run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh scripts/install.sh scripts/fleetdock \
            backend/docker-entrypoint.sh \
            backend/internal/interfaces/httpapi/install_script.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No secrets needed to build any more: nothing deployment-specific is
      # baked into the image.
      - name: build image
        run: docker build -t fleetdock:ci .

      - name: verify image
        run: |
          docker run --rm --entrypoint node fleetdock:ci --version
          docker run --rm --entrypoint sh fleetdock:ci -c 'test -f /opt/fleetdock/ui/server.js'
          docker run --rm --entrypoint sh fleetdock:ci -c 'test -d /opt/fleetdock/ui/.next/static'

      - name: validate compose
        run: |
          docker compose --env-file /dev/null config >/dev/null
          docker compose --env-file /dev/null --profile gateway config >/dev/null
        env:
          FLEETDOCK_SITE_ADDRESS: http://localhost
          FLEETDOCK_PUBLIC_URL: http://localhost
          FLEETDOCK_JWT_SECRET: ci
          FLEETDOCK_ENCRYPTION_KEY: ci
          FLEETDOCK_ADMIN_PASSWORD: ci

  cross-build:
    # Catches arm64 breakage before a tag is cut, when it would otherwise only
    # surface during a release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build both architectures
        run: docker buildx build --platform linux/amd64,linux/arm64 .
