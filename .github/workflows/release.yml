name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # Nothing is published from a tag that does not pass the whole CI suite:
  # unit, integration and upgrade tests, the image scan, the boot smoke test
  # and the end-to-end tests.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Keyless signing: cosign proves the image and checksums came from this
      # workflow on this repository, with GitHub's OIDC identity.
      id-token: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Image name (GHCR requires lowercase)
        id: images
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/fleetdock" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Emits both v-prefixed and bare tags, so the FLEETDOCK_RELEASE_TAG in the
      # docs works either way. The old hand-rolled ${GITHUB_REF_NAME#v} pushed
      # only the bare form while the docs said to use the v-prefixed one.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.images.outputs.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A pre-release tag (v0.10.0-rc.1) must not move `latest`, or every
            # `fleetdock update` would pick up the release candidate.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      # Needed for the arm64 runtime layer. Both build stages cross-compile from
      # the native platform, so only that thin layer is emulated.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image containing the control plane and the dashboard. No
      # NEXT_PUBLIC_API_URL build arg: the dashboard is same-origin with
      # whatever host serves it, so this image works unmodified for every
      # self-hoster rather than being pinned to fleetdock.dev.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        run: cosign sign --yes "${{ steps.images.outputs.image }}@${{ steps.build.outputs.digest }}"

      # Cheap guards for the two ways this image silently breaks: a node too old
      # for Next, and a dashboard bundle that did not get copied.
      - name: Verify image
        run: |
          # The tag this run built — :latest could be a different, older image
          # if a later tag raced this one.
          IMG="${{ steps.images.outputs.image }}:${{ github.ref_name }}"
          docker pull "$IMG"
          docker run --rm --entrypoint node "$IMG" --version
          docker run --rm --entrypoint sh "$IMG" -c 'test -f /opt/fleetdock/ui/server.js'
          docker run --rm --entrypoint sh "$IMG" -c 'test -d /opt/fleetdock/ui/.next/static'
          docker run --rm --entrypoint sh "$IMG" -c 'test -x /opt/fleetdock/agents/fleetdock-agent-linux-amd64'
          docker run --rm --entrypoint sh "$IMG" -c 'cd /opt/fleetdock/agents && sha256sum -c SHA256SUMS'
          # The binaries must report the tag, or agents and the dashboard show "dev".
          want="${GITHUB_REF_NAME#v}"
          got="$(docker run --rm --entrypoint /api "$IMG" version)"
          echo "$got"
          case "$got" in "fleetdock $want"*) ;; *) echo "::error::image reports '$got', expected $want"; exit 1 ;; esac

      - name: Build release archives
        working-directory: backend
        run: |
          mkdir -p ../dist
          pkg=github.com/Fleetdock/fleetdock/backend/internal/version
          ldflags="-s -w -X $pkg.Version=${GITHUB_REF_NAME} -X $pkg.Commit=${GITHUB_SHA} -X $pkg.Date=${{ github.event.head_commit.timestamp }}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="$ldflags" \
              -o ../dist/fleetdock-agent-linux-$arch ./cmd/agent
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="$ldflags" \
              -o ../dist/fleetdock-api-linux-$arch ./cmd/api
          done
          cd ../dist && sha256sum fleetdock-* > SHA256SUMS

      - name: Package release tarballs
        run: |
          tar -czf fleetdock-agents-${{ github.ref_name }}.tar.gz -C dist \
            fleetdock-agent-linux-amd64 fleetdock-agent-linux-arm64 SHA256SUMS
          tar -czf fleetdock-api-${{ github.ref_name }}.tar.gz -C dist \
            fleetdock-api-linux-amd64 fleetdock-api-linux-arm64 SHA256SUMS

      - name: Generate release notes
        # This version's section of CHANGELOG.md, with links made absolute
        # (relative ones would resolve against /releases/tag/ and break).
        run: |
          scripts/changelog.sh notes "${{ github.ref_name }}" > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release ${{ github.ref_name }}" > release-notes.md
          fi

      # install.sh and docker-compose.yml are attached so a release can be
      # installed from a pinned tag, not just from the tip of main.
      - name: Checksum installer artefacts
        run: sha256sum scripts/install.sh scripts/fleetdock docker-compose.yml > INSTALLER-SHA256SUMS

      - name: Sign the checksums
        run: |
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          cosign sign-blob --yes --bundle INSTALLER-SHA256SUMS.sigstore.json INSTALLER-SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # v0.10.0-rc.1 and the like are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The notes come from CHANGELOG.md only, not GitHub's list of PRs.
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            fleetdock-agents-${{ github.ref_name }}.tar.gz
            fleetdock-api-${{ github.ref_name }}.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
            scripts/install.sh
            scripts/fleetdock
            docker-compose.yml
            INSTALLER-SHA256SUMS
            INSTALLER-SHA256SUMS.sigstore.json
