name: Bug Report
description: Report something that isn't working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do **not** include secrets, passwords, or connection strings.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I try to restore a backup, the operation fails with...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start stack with `make up`
        2. Create instance ...
        3. Trigger backup ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or git SHA
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API / backend
        - Agent
        - Frontend / dashboard
        - Docker / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste API logs, agent logs, or browser console output (redact secrets).
      render: shell
