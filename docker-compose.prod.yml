# Production overlay for docker compose.
#
# Usage:
#   cp .env.example .env && ./scripts/generate-secrets.sh >> .env
#   # Edit .env: FLEETDOCK_ENV=production, FLEETDOCK_DATABASE_URL (hosted Postgres), URLs, etc.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# This file:
#   - Forces FLEETDOCK_ENV=production
#   - Omits the bundled postgres service (use managed Postgres via FLEETDOCK_DATABASE_URL)
#   - Does not publish backend/frontend ports (put TLS reverse proxy in front)

services:
  postgres:
    profiles: ["dev-postgres"]

  backend:
    # Drops only the bundled-postgres dependency; the gateway ordering must
    # survive, or the API starts before HAProxy can accept a config reload.
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      FLEETDOCK_ENV: production
    ports: !reset []

  frontend:
    ports: !reset []
