      responses:
        "200":
          description: Instance
    delete:
      tags: [Instances]
      security: [{bearerAuth: []}]
      summary: Delete instance
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Deleted

  /v1/instances/{id}/start:
    post:
      tags: [Instances]
      security: [{bearerAuth: []}]
      summary: Start instance
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "202":
          description: Started

  /v1/instances/{id}/stop:
    post:
      tags: [Instances]
      security: [{bearerAuth: []}]
      summary: Stop instance
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "202":
          description: Stopped

  /v1/instances/{id}/restart:
    post:
      tags: [Instances]
      security: [{bearerAuth: []}]
      summary: Restart instance
      parameters:
        - $ref: "#/components/parameters/ResourceID"
