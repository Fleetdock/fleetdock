        "200":
          description: Backup

  /v1/backups/{id}/restore:
    post:
      tags: [Backups]
      security: [{bearerAuth: []}]
      summary: Restore backup
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "202":
          description: Restore started

  /v1/moves:
    post:
      tags: [Moves]
      security: [{bearerAuth: []}]
      summary: Start database move
      responses:
        "202":
          description: Move started

  /v1/backup-destinations:
    get:
      tags: [Destinations]
      security: [{bearerAuth: []}]
      summary: List backup destinations
      responses:
        "200":
          description: Destinations
    post:
      tags: [Destinations]
      security: [{bearerAuth: []}]
      summary: Create destination
      responses:
        "201":
          description: Created

  /v1/backup-destinations/{id}:
    patch:
      tags: [Destinations]
      security: [{bearerAuth: []}]
      summary: Update destination
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Updated
    delete:
      tags: [Destinations]
      security: [{bearerAuth: []}]
      summary: Delete destination
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Deleted

  /v1/backup-destinations/{id}/test:
    post:
      tags: [Destinations]
      security: [{bearerAuth: []}]
      summary: Test destination connectivity
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Result

  /v1/backup-schedules:
    get:
      tags: [Schedules]
      security: [{bearerAuth: []}]
      summary: List backup schedules
      responses:
        "200":
          description: Schedules
    post:
      tags: [Schedules]
      security: [{bearerAuth: []}]
      summary: Create schedule
      responses:
        "201":
          description: Created

  /v1/backup-schedules/{id}:
    patch:
      tags: [Schedules]
      security: [{bearerAuth: []}]
      summary: Update schedule
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Updated
    delete:
      tags: [Schedules]
      security: [{bearerAuth: []}]
      summary: Delete schedule
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Deleted

  /v1/audit:
    get:
      tags: [Audit]
      security: [{bearerAuth: []}]
      summary: Audit log
      responses:
        "200":
          description: Audit entries

  /v1/notification-channels:
    get:
      tags: [Notifications]
      security: [{bearerAuth: []}]
      summary: List notification channels
      responses:
        "200":
          description: Channels
    post:
      tags: [Notifications]
      security: [{bearerAuth: []}]
      summary: Create channel
      responses:
        "201":
          description: Created

  /v1/notification-channels/{id}:
    patch:
      tags: [Notifications]
      security: [{bearerAuth: []}]
      summary: Update channel
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Updated
    delete:
      tags: [Notifications]
      security: [{bearerAuth: []}]
      summary: Delete channel
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Deleted

  /v1/notification-channels/{id}/test:
    post:
      tags: [Notifications]
      security: [{bearerAuth: []}]
      summary: Test notification channel
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Sent

  /v1/alert-rules:
    get:
      tags: [Notifications]
      security: [{bearerAuth: []}]
      summary: List alert rules
      responses:
        "200":
          description: Rules
    post:
      tags: [Notifications]
      security: [{bearerAuth: []}]
      summary: Create alert rule
      responses:
        "201":
          description: Created

  /v1/alert-rules/{id}:
    patch:
      tags: [Notifications]
      security: [{bearerAuth: []}]
      summary: Update alert rule
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Updated
    delete:
      tags: [Notifications]
      security: [{bearerAuth: []}]
      summary: Delete alert rule
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Deleted

  /v1/tokens:
    get:
      tags: [Tokens]
      security: [{bearerAuth: []}]
      summary: List API tokens
      responses:
        "200":
          description: Tokens
    post:
      tags: [Tokens]
      security: [{bearerAuth: []}]
      summary: Create API token
      responses:
        "201":
          description: Token with raw secret

  /v1/tokens/{id}:
    delete:
      tags: [Tokens]
      security: [{bearerAuth: []}]
      summary: Revoke API token
      parameters:
        - $ref: "#/components/parameters/ResourceID"
