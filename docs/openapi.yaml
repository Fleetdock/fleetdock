      security: [{bearerAuth: []}]
      summary: List databases
      responses:
        "200":
          description: Databases
    post:
      tags: [Databases]
      security: [{bearerAuth: []}]
      summary: Create database
      responses:
        "201":
          description: Created

  /v1/databases/{id}:
    get:
      tags: [Databases]
      security: [{bearerAuth: []}]
      summary: Get database
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Database
    delete:
      tags: [Databases]
      security: [{bearerAuth: []}]
      summary: Delete database
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "204":
          description: Deleted

  /v1/databases/{id}/lock:
    post:
      tags: [Databases]
      security: [{bearerAuth: []}]
      summary: Lock database
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Locked

  /v1/databases/{id}/unlock:
    post:
      tags: [Databases]
      security: [{bearerAuth: []}]
      summary: Unlock database
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Unlocked

  /v1/instances/{id}/db-users:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: List DB users on instance
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Users
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Create DB user
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "201":
          description: Created

  /v1/instances/{id}/db-users/drop:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Drop DB user
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Dropped

  /v1/instances/{id}/db-users/grants:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: User grants on instance
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Grants

  /v1/instances/{id}/grants:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Grant privileges
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Granted

  /v1/instances/{id}/grants/revoke:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Revoke privileges
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Revoked

  /v1/databases/{id}/grants:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Schema grants
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Grants
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Grant on database
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Granted

  /v1/databases/{id}/grants/revoke:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Revoke on database
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Revoked

  /v1/databases/{id}/db-users:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: DB users for database
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Users

  /v1/databases/{id}/tables:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: List tables
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Tables

  /v1/databases/{id}/tables/{table}/rows:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Browse table rows
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: table
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rows

  /v1/databases/{id}/tables/{table}/schema:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Table schema
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: table
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema

  /v1/databases/{id}/tables/{table}/export:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Export table CSV
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - name: table
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Export URL

  /v1/databases/{id}/query:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: SQL query console
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Query result

  /v1/databases/{id}/export:
    post:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Export query results
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Export URL

  /v1/db-privileges:
    get:
      tags: [DBAdmin]
      security: [{bearerAuth: []}]
      summary: Privilege catalog
      responses:
        "200":
          description: Privileges

  /v1/operations:
    get:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: List operations
      responses:
        "200":
          description: Operations

  /v1/operations/{id}:
    get:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Get operation
      parameters:
        - $ref: "#/components/parameters/ResourceID"
