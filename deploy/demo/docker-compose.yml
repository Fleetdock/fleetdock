# Fleetdock demo stack — a throwaway install with sample databases, used to
# capture the screenshots in docs/screenshots and on fleetdock.dev.
#
#   scripts/screenshots.sh            # build, start, seed, capture
#   docker compose -f deploy/demo/docker-compose.yml -p fleetdock-demo down -v
#
# It is a separate compose project bound to 127.0.0.1 only, so it runs next
# to a real install without touching it. The credentials below are demo
# values: never reuse this file for anything real.
name: fleetdock-demo

x-demo-secrets: &demo-secrets
  FLEETDOCK_JWT_SECRET: demo-only-jwt-secret-not-for-production-0000000000
  FLEETDOCK_ENCRYPTION_KEY: demo-only-encryption-key-not-for-production-00000
  FLEETDOCK_ADMIN_EMAIL: admin@demo.fleetdock.dev
  FLEETDOCK_ADMIN_PASSWORD: fleetdock-demo-password

services:
  fleetdock:
    image: ghcr.io/fleetdock/fleetdock:${FLEETDOCK_DEMO_TAG:-dev}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FLEETDOCK_DEMO_PORT:-18080}:8080"
    environment:
      <<: *demo-secrets
      FLEETDOCK_HTTP_ADDR: ":8080"
      FLEETDOCK_DATABASE_URL: postgres://fleetdock:fleetdock@metadata:5432/fleetdock?sslmode=disable
      # Not "production": that mode refuses the published demo secrets above.
      FLEETDOCK_ENV: demo
      FLEETDOCK_PUBLIC_URL: http://localhost:${FLEETDOCK_DEMO_PORT:-18080}
      FLEETDOCK_CORS_ORIGIN: http://localhost:${FLEETDOCK_DEMO_PORT:-18080}
      FLEETDOCK_WORKER_ENABLED: "true"
      FLEETDOCK_METRICS_RETENTION: 168h
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      metadata:
        condition: service_healthy

  # Fleetdock's own metadata database.
  metadata:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetdock
      POSTGRES_PASSWORD: fleetdock
      POSTGRES_DB: fleetdock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetdock -d fleetdock"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Sample database servers Fleetdock manages in the screenshots.
  demo-postgres:
    image: postgres:16-alpine
    # pg_stat_statements feeds the "Top queries" view.
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      POSTGRES_USER: fleetdock_admin
      POSTGRES_PASSWORD: demo-postgres-password
      POSTGRES_DB: postgres
    volumes:
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetdock_admin"]
      interval: 3s
      timeout: 3s
      retries: 30

  demo-mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: demo-mariadb-password
    volumes:
      - ./sql/mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  demo-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: demo-mysql-password
    volumes:
      - ./sql/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdemo-mysql-password --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Agent-connected servers for the Servers page and its metric charts. Each
  # waits for a registration token that scripts/demo/seed.mjs writes to
  # ./.agent-tokens/<hostname>, downloads the agent from the control plane and
  # runs it. Enrollment is kept in the state volume, so restarts reuse it. No
  # Docker socket: these servers only report heartbeats and metrics.
  # A little steady traffic so Monitoring shows live sessions and top queries.
  demo-load:
    image: postgres:16-alpine
    depends_on:
      demo-postgres:
        condition: service_healthy
    environment:
      PGHOST: demo-postgres
      PGUSER: fleetdock_admin
      PGPASSWORD: demo-postgres-password
    entrypoint:
      - sh
      - -c
      - |
        report() {
          while true; do
            psql -qAt -d shop -c "SELECT pg_sleep(0.3), r.* FROM (SELECT c.country, count(*), sum(o.total_cents) FROM orders o JOIN customers c ON c.id = o.customer_id WHERE o.placed_at > now() - interval '1 day' * (random() * 20) GROUP BY 1) r" >/dev/null
            psql -qAt -d analytics -c "SELECT name, count(*) FROM events WHERE occurred_at > now() - interval '3 days' GROUP BY name" >/dev/null
            sleep 2
          done
        }
        lookups() {
          while true; do
            psql -qAt -d shop -c "SELECT * FROM products WHERE category = 'audio' AND active ORDER BY price_cents DESC LIMIT 20" >/dev/null
            psql -qAt -d billing -c "SELECT status, count(*), sum(amount_cents) FROM invoices GROUP BY status" >/dev/null
            sleep 1
          done
        }
        report & lookups & report &
        # A long-running report, the kind Monitoring helps you find.
        psql -d shop -c "BEGIN; SELECT count(*) FROM customers; SELECT pg_sleep(86400);" >/dev/null &
        wait
    restart: unless-stopped

  agent-eu:
    <<: &demo-agent
      image: alpine:3.22
      restart: unless-stopped
      depends_on:
        fleetdock:
          condition: service_healthy
      environment:
        FLEETDOCK_URL: http://fleetdock:8080
        FLEETDOCK_STATE_DIR: /var/lib/fleetdock-agent
      entrypoint: ["/bin/sh", "-c"]
      command:
        - |
          set -u
          case "$$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported architecture $$(uname -m)"; exit 1 ;;
          esac
          tokfile="/tokens/$$(hostname)"
          state="$$FLEETDOCK_STATE_DIR/state.json"
          while true; do
            if [ ! -s "$$state" ]; then
              until [ -s "$$tokfile" ]; do echo "waiting for registration token in $$tokfile"; sleep 3; done
              FLEETDOCK_TOKEN="$$(cat "$$tokfile")"
              export FLEETDOCK_TOKEN
            fi
            if wget -qO /usr/local/bin/fleetdock-agent.tmp "$$FLEETDOCK_URL/agent/v1/binary/linux/$$arch"; then
              chmod +x /usr/local/bin/fleetdock-agent.tmp
              mv /usr/local/bin/fleetdock-agent.tmp /usr/local/bin/fleetdock-agent
              /usr/local/bin/fleetdock-agent
              echo "agent exited ($$?); retrying in 5s"
            else
              echo "agent download failed; retrying in 5s"
            fi
            sleep 5
          done
    hostname: db-eu-1
    volumes:
      - ./.agent-tokens:/tokens:ro
      - agent-eu-state:/var/lib/fleetdock-agent

  agent-us:
    <<: *demo-agent
    hostname: db-us-1
    volumes:
      - ./.agent-tokens:/tokens:ro
      - agent-us-state:/var/lib/fleetdock-agent

  # S3-compatible backup storage (SeaweedFS). The bucket is created on start.
  s3:
    image: chrislusf/seaweedfs:4.50
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/status >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  s3-init:
    image: chrislusf/seaweedfs:4.50
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo 's3.bucket.create -name fleetdock-backups' | weed shell -master=s3:9333; exit 0"]
    restart: "no"

configs:
  s3_identities:
    content: |
      {"identities":[{"name":"fleetdock","credentials":[{"accessKey":"fleetdock-demo","secretKey":"demo-s3-secret-key"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  agent-eu-state:
  agent-us-state:
