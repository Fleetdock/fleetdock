# Bootstrap config, seeded into the gateway volume on first start only.
# Fleetdock replaces /var/lib/fleetdock/gateway/haproxy.cfg and reloads HAProxy
# whenever public endpoints change.
#
# Keep the global block in sync with Generate() in
# backend/internal/platform/gateway/gateway.go — in particular the stats socket,
# which the control plane reads to report endpoint health, and the health
# frontend, which the container healthcheck probes before any endpoint exists.

global
  log stdout format raw local0
  maxconn 50000
  stats socket /var/lib/fleetdock/gateway/haproxy-admin.sock mode 660 level admin expose-fd listeners
  stats timeout 30s

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 10s
  timeout client  1h
  timeout server  1h

frontend fe_gateway_health
  bind *:8404
  mode http
  http-request return status 200
